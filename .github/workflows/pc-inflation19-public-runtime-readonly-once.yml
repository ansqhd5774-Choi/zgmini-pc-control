name: ZGMINI Inflation 19 Public Runtime Readonly
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: zgmini-inflation19-public-runtime-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-inflation19-public-runtime-readonly-once'
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 3
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout fixed event SHA code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: GET public saved-only API and HTML with zero writes
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\inflation19-public-runtime-readonly-once.mjs"'
      - name: Return bounded issue-bound status only
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\inflation19-public-runtime-readonly-once.mjs" --upload'
