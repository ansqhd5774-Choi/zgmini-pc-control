name: SEC Core Structural Insert Contract (source-only)
on:
  pull_request:
    paths:
      - 'writer-b/insert-only-patch.mjs'
      - 'writer-b/insert-preview-readonly.mjs'
      - 'tests/sec-core-structural-insertion.test.mjs'
      - '.github/workflows/sec-core-structural-insert-test.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate exact structural insert contract (no PC)
        run: node --test tests/sec-core-structural-insertion.test.mjs
