# CI-only failure intake. Operates from reviewed default-branch source, never checkout failed PR SHA.
name: ZGMINI CI Failure Issue Intake
on:
  workflow_run:
    workflows:
      - 'C996 R5 Readonly Source Checks'
      - 'ZGMINI PC Secret Scan'
      - 'ZGMINI Controller Maintenance Source Tests'
      - 'W05 QFR Publication - Focused Source CI'
      - 'Issue Lifecycle Eligibility (offline)'
      - 'ZGMINI Automation Status Readonly Source Tests'
      - 'ZGMINI CNN Sidecar B Source Contract CI'
      - 'ZGMINI D05 Readonly Source Tests'
      - 'ZGMINI 092 Writer B Source and Lineage Tests'
      - 'SEC Core four-file Writer B approval source tests'
      - 'ZGMINI W04 DOL Manual Source Tests'
      - 'SEC Core Structural Insert Contract (source-only)'
      - 'ZGMINI Agent Handoff PR Evidence CI'
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  record-verified-failure:
    # Only admitted failure writers share the queue. Other completion events
    # remain visible as skipped runs but cannot reserve the writer lane.
    concurrency:
      group: ci-failure-issue-intake
      queue: max
      cancel-in-progress: false
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      (github.event.repository.private == true || github.event.repository.private == false) &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify GitHub CI failure and upsert one incident Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-failure-issue.mjs
