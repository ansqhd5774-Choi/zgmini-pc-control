name: ZGMINI Agent Handoff Writer B Failure Intake
on:
  workflow_run:
    workflows: [ZGMINI Approved Writer B Source Overlay Once]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  enqueue-verified-writer-b-failures:
    concurrency:
      group: agent-handoff-writer-b-failure-intake
      cancel-in-progress: false
      queue: max
    # Independent opt-in. Existing PC Job intake activation does not enable B.
    if: >-
      vars.ZGMINI_PC_HANDOFF_WRITER_B_INTAKE_ENABLED == 'true' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.workflow_run.event == 'issues' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.actor.login == 'ansqhd5774-Choi' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    outputs:
      selection_reused: ${{ steps.selection-noop.outcome == 'success' && steps.selection-noop.outputs.reusable == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify read-back Writer B evidence and enqueue only confirmed failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: cmd
        run: node agent-handoff/writer-b-failure-producer.mjs
      # Optional read-only proof; failure or uncertainty retains the normal selection Job.
      - name: Verify all pending selection receipts without writing
        id: selection-noop
        if: >-
          github.event_name == 'workflow_run' &&
          vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'ansqhd5774-Choi'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: cmd
        run: node agent-handoff/queue-dispatcher.mjs --verify-noop
  # Keep original intake independent; avoid a second completion-triggered Run.
  verify-and-select-after-failure-intake:
    needs: enqueue-verified-writer-b-failures
    if: >-
      needs.enqueue-verified-writer-b-failures.result == 'success' &&
      needs.enqueue-verified-writer-b-failures.outputs.selection_reused != 'true' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'ansqhd5774-Choi'
    permissions:
      contents: read
      issues: write
    concurrency:
      group: zgmini-handoff-candidate-selector
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify up to 10 incidents sequentially and record metadata-only candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-dispatcher.mjs
  authenticated-readonly-board-after-selection:
    needs: [enqueue-verified-writer-b-failures, verify-and-select-after-failure-intake]
    if: >-
      !cancelled() && !failure() &&
      needs.enqueue-verified-writer-b-failures.result == 'success' &&
      (needs.verify-and-select-after-failure-intake.result == 'success' ||
       (needs.verify-and-select-after-failure-intake.result == 'skipped' &&
        needs.enqueue-verified-writer-b-failures.outputs.selection_reused == 'true')) &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.actor == 'ansqhd5774-Choi' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: zgmini-handoff-control-board
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 6
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Classify authenticated backlog, priority, owner receipts and review age
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-board-runner.mjs
