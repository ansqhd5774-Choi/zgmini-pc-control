name: "ZGMINI #996 TEMP-only Windows native proof (owner labeled)"

on:
  pull_request:
    types: [labeled]

# Owner/label/variable/source pin and machine guards remain mandatory.
# This is not an authorization to run the production C operator.
permissions:
  contents: read

concurrency:
  group: zgmini-996-temp-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  temp-native-once:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'zgmini-996-native-once' &&
      github.event.pull_request.number == 1222 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.ZGMINI_996_TEMP_NATIVE_ONCE_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - name: Require separately approved isolated Windows machine before checkout
        env:
          APPROVED_RUNNER_NAME: zgmini-handoff-ci-spare-01
          APPROVED_MACHINE_NAME: DESKTOP-N62L0NG
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="%APPROVED_RUNNER_NAME%" (echo C996_TEMP_RUNNER_IDENTITY_DENIED & exit /b 31)
          if /I not "%COMPUTERNAME%"=="%APPROVED_MACHINE_NAME%" (echo C996_TEMP_MACHINE_IDENTITY_DENIED & exit /b 35)
          if exist "E:\ZGmini" (echo C996_TEMP_ORIGINAL_E_DRIVE_FORBIDDEN & exit /b 32)
          if /I "%ZGMINI_996_TEMP_ONLY_ON_ORIGINAL_PC%"=="1" (echo C996_TEMP_ORIGINAL_PC_OVERRIDE_FORBIDDEN & exit /b 33)
          for %%P in ("%RUNNER_TEMP%" "%GITHUB_WORKSPACE%" "%TEMP%" "%TMP%") do (
            if /I "%%~dP"=="E:" (echo C996_TEMP_E_DRIVE_FORBIDDEN & exit /b 34)
          )
          set "C996_NODE=%RUNNER_TEMP%\..\..\externals\node20\bin\node.exe"
          if not exist "%C996_NODE%" (echo C996_TEMP_RUNNER_BUNDLED_NODE_MISSING & exit /b 36)
      - name: Refuse redirected or non-C workspace and TEMP before checkout (Node, no ps1)
        run: |
          @echo off
          set "C996_NODE=%RUNNER_TEMP%\..\..\externals\node20\bin\node.exe"
          "%C996_NODE%" -e "const fs=require('fs'),p=require('path'); for(const k of ['RUNNER_TEMP','GITHUB_WORKSPACE','TEMP','TMP']) {const v=process.env[k];if(!v)throw Error('C996_TEMP_PATH_UNSET_'+k);const full=p.win32.resolve(v),parsed=p.win32.parse(full);if(parsed.root.toLowerCase()!=='c:\\')throw Error('C996_TEMP_NON_C_VOLUME_'+k);if(!fs.existsSync(full)||!fs.statSync(full).isDirectory())throw Error('C996_TEMP_PATH_MISSING_'+k);let current=full;while(true){if(fs.lstatSync(current).isSymbolicLink())throw Error('C996_TEMP_PATH_REPARSE_'+k);const parent=p.win32.dirname(current);if(parent===current)break;current=parent;}const real=fs.realpathSync(full);if(p.win32.parse(real).root.toLowerCase()!=='c:\\')throw Error('C996_TEMP_REAL_VOLUME_DENIED_'+k);}"
          if errorlevel 1 exit /b 37
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e03173cd34a4d3ea37b956d7e35fa335494bb0e3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact source and available Windows C sharp compiler
        run: |
          @echo off
          node -e "const fs=require('fs'),crypto=require('crypto');const expected={'tools/TEST_996_WINDOWS_TEMP_SECURITY_WINDOW.ps1':'6E8E78FF2584731495E49FF8F9326ECB8F806C8C4668814DEDB629A393661461','tools/TEST_996_WINDOWS_TEMP_SECURITY_WINDOW_NATIVE.cs':'B2E56BE4599C32A7F379B9BD66DACFEA5780D8CA2CC340800C2C6948380B09AA','tests/controller-996-windows-temp-security-window.test.mjs':'94546C5F84990B85DB42B0E4EF440955FE57139C76C94C1581A31F5CA636A8E9'};for(const [p,sha] of Object.entries(expected)){if(!fs.existsSync(p))throw Error('C996_TEMP_REQUIRED_SOURCE_MISSING_'+p);const bytes=fs.readFileSync(p),text=bytes.toString('utf8');if(!Buffer.from(text,'utf8').equals(bytes))throw Error('C996_TEMP_SOURCE_NOT_UTF8_'+p);const normalized=text.replace(/\r\n/g,'\n');if(normalized.includes('\r'))throw Error('C996_TEMP_SOURCE_UNEXPECTED_CR_'+p);const got=crypto.createHash('sha256').update(normalized,'utf8').digest('hex').toUpperCase();if(got!==sha)throw Error('C996_TEMP_SOURCE_SHA256_MISMATCH_'+p);}if(fs.existsSync('E:\\ZGmini'))throw Error('C996_TEMP_ORIGINAL_PC_FORBIDDEN');"
          if errorlevel 1 exit /b 41
          if not exist "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" (echo C996_TEMP_NATIVE_COMPILER_MISSING & exit /b 42)
          if exist "%RUNNER_TEMP%\zgmini-996-native-%GITHUB_RUN_ID%.exe" (echo C996_TEMP_NATIVE_OUTPUT_ALREADY_EXISTS & exit /b 43)
      - name: Compile signed-system-compiler native TEMP-only test fixture
        run: |
          @echo off
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /r:System.Core.dll /r:System.Runtime.Serialization.dll /out:"%RUNNER_TEMP%\zgmini-996-native-%GITHUB_RUN_ID%.exe" "tools\TEST_996_WINDOWS_TEMP_SECURITY_WINDOW_NATIVE.cs"
          if errorlevel 1 exit /b 44
      - name: First verify one native ACL restore before long timeout scenarios
        run: |
          @echo off
          set "ZGMINI_996_NATIVE_EXE=%RUNNER_TEMP%\zgmini-996-native-%GITHUB_RUN_ID%.exe"
          node --test --test-name-pattern="native TEMP ACL restoration .normal." "tests/controller-996-windows-temp-security-window.test.mjs"
          if errorlevel 1 (echo C996_TEMP_FOCUSED_RESTORE_FAILED & exit /b 47)
      - name: Run exactly ten tests and require six native passes (no PowerShell scripts)
        run: |
          @echo off
          set "ZGMINI_996_NATIVE_EXE=%RUNNER_TEMP%\zgmini-996-native-%GITHUB_RUN_ID%.exe"
          set "C996_TAP=%RUNNER_TEMP%\zgmini-996-temp-native-%GITHUB_RUN_ID%.tap"
          node --test --test-concurrency=1 --test-reporter=tap "tests/controller-996-windows-temp-security-window.test.mjs" > "%C996_TAP%" 2>&1
          if errorlevel 1 (type "%C996_TAP%" & echo C996_TEMP_NODE_EXIT_FAILED & exit /b 45)
          node -e "const fs=require('fs');const s=fs.readFileSync(process.env.C996_TAP,'utf8');for(const [k,v] of Object.entries({tests:10,pass:10,fail:0,cancelled:0,skipped:0,todo:0})){if(!new RegExp('^# '+k+' '+v+'\\r?$','m').test(s))throw Error('C996_TEMP_TAP_SUMMARY_INVALID_'+k);}"
          if errorlevel 1 (type "%C996_TAP%" & exit /b 46)
          echo C996_TEMP_NATIVE_10_PASS_0_SKIP
          echo C996_TEMP_PRODUCTION_C_NOT_AUTHORIZED
