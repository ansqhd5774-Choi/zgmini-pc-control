# R17 SIP three-file private source installation. Source-only until reviewed
# and registered on the control main. No scheduler/provider/D1/DB writes.
name: ZGMINI R17 SIP Writer B Three File Install Once
on:
  issues:
    types: [opened]
permissions:
  contents: write # Create-only bounded private result TXT/JSON.
  issues: write # One bounded result comment.
concurrency:
  group: zgmini-r17-sip-writer-b-install-once
  cancel-in-progress: false
jobs:
  r17-sip-threefile-approved-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-r17-sip-threefile-install' &&
      contains(github.event.issue.labels.*.name, 'pc-r17-writer-b-install') &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    env:
      R17_SIP_CONTROL_SHA: ${{ github.sha }}
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Checkout exact private control event SHA
        id: checkout-control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: r17-sip-control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout fixed reviewed public SIP source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: b30aefd89793de093369044a14d86c1fdc3b0d61
          path: r17-sip-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: One authenticated three-file private Writer installation
        id: r17-install
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\r17-sip-control\r17-sip-b\r17-sip-b-install-windows.mjs" > "%RUNNER_TEMP%\r17-sip-b-install-result.json"'
      - name: Read back and upload bounded private result, never rerun install
        if: always() && steps.checkout-control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\r17-sip-control\r17-sip-b\r17-sip-b-install-upload.mjs"'
