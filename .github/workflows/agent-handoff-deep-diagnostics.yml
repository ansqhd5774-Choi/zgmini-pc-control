name: ZGMINI Handoff Deep Evidence Diagnostics R2
on:
  # Existing schedule remains the 15-minute periodic path.
  # Source-verified events are a separate fallback while GitHub's scheduler is unobserved.
  workflow_run:
    workflows:
      - ZGMINI Handoff Queue Candidate Selector
      - ZGMINI Agent Handoff PR Evidence CI
    types: [completed]
  issues:
    types: [labeled]
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-handoff-deep-diagnostics.yml
      - agent-handoff/deep-diagnostics-runner.mjs
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  issues: write
# Serialize both diagnostic writers to the shared evidence ledger.
jobs:
  handoff-evidence-and-conditional-simulation:
    concurrency:
      group: zgmini-proactive-diagnostics-ledger
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'ansqhd5774-Choi') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == 'ansqhd5774-Choi' &&
        (github.event.workflow_run.name == 'ZGMINI Handoff Queue Candidate Selector' ||
         github.event.workflow_run.name == 'ZGMINI Agent Handoff PR Evidence CI') &&
        (github.event.workflow_run.name != 'ZGMINI Handoff Queue Candidate Selector' ||
         github.event.workflow_run.head_branch == 'main')) ||
       (github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'handoff-agent-pending' &&
        github.event.issue.state == 'open' &&
        github.event.issue.user.login == 'ansqhd5774-Choi' &&
        github.actor == 'ansqhd5774-Choi') ||
       (github.event_name == 'push' &&
        github.actor == 'ansqhd5774-Choi'))
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 6
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read verified seven-day backlog and publish bounded evidence only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/deep-diagnostics-runner.mjs
