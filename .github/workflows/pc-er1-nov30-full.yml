# Review-only B registration. Merge and PC operations require separate review.
name: ZGMINI PC November ER1 Full Private And Score D1
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: zgmini-er1-nov30-full-b
  cancel-in-progress: false

jobs:
  november-full:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-er1-nov30-full' &&
      contains(github.event.issue.labels.*.name, 'pc-er1-approved')
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout reviewed control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout reviewed public ER1 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          # Must match the exact reviewed approval manifest and entry pin.
          ref: a6dd77d19ccfcb79ddcdd0b4a6f495ec3888e24a
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Run approved bounded November ER1 action
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-nov30-full-entry.mjs"'
      - name: Report sanitized status to original issue
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-nov30-full-entry.mjs" --upload'
