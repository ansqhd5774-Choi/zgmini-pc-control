name: ZGMINI Handoff Watch Runner Context Readonly
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
concurrency:
  group: handoff-watch-context-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  check-handoff-runner-context:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'handoff-watch-runner-context-readonly' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 2
    defaults:
      run:
        shell: cmd
    steps:
      - name: Confirm isolated queue host before checking out source
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo HANDOFF_WATCH_CONTEXT_ISOLATED_HOST=TRUE
          ) else (
            echo HANDOFF_WATCH_CONTEXT_ISOLATED_HOST=FALSE
            exit /b 5
          )
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read only Runner Windows session and bounded 5-second GitHub sample
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/handoff-watch-runner-context-readonly.mjs
