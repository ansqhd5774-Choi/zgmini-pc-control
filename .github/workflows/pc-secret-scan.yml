# Adapted from https://github.com/gitleaks/gitleaks-action (v3).
# An isolated, source-only PR scan; no controller, Writer, provider, DB or PC effects.
name: ZGMINI PC Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '**/*.mjs'
      - '**/*.js'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.vbs'
      - '**/*.cmd'
      - '.github/workflows/pc-secret-scan.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zgmini-pc-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 8
    steps:
      - name: Checkout source without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The action invokes gitleaks with --redact; prevent leaked snippets from
      # being published to PR comments, SARIF artifacts or GitHub Job Summary.
      - name: Scan pull request changes for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
