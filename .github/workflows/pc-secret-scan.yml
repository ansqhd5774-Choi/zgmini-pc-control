# Adapted from the official https://github.com/gitleaks/gitleaks CLI.
# v3 Gitleaks Action requests a nonexistent Windows .tar.gz asset (HTTP 404).
# Use the real release ZIP with pinned sha256, only in isolated Windows CI.
name: ZGMINI PC Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zgmini-pc-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - name: Verify exact isolated queue PC
        run: |
          if /I not "%COMPUTERNAME%"=="DESKTOP-N62L0NG" exit /b 5
      - name: Checkout PR head without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify fail-closed range and release hash contract
        run: node --test tests/ci-gitleaks-pr.test.mjs
      - name: Gitleaks PR history scan (sanitized status only)
        run: node tools/ci-gitleaks-pr.mjs
