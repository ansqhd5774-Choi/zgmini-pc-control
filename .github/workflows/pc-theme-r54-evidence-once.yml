# Fixed, one-time, B-approved R54 evidence readback on existing self-hosted PC.
# This never invokes Controller operations, the publisher or provider APIs.
name: ZGMINI Theme R54 Raw Evidence Once
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: zgmini-theme-r54-evidence-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  r54-raw-evidence-once:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-theme-r54-evidence-readonly-once' &&
      !contains(github.event.issue.labels.*.name, 'pc-job') &&
      !contains(github.event.issue.labels.*.name, 'pc-maintenance')
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout exact issue-event control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: r54-control
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Checkout immutable reviewed R54 raw-evidence adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: 77c6cc43a2450f34a7cfe81f39040807e727f1cf
          path: r54-adapter
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Inspect fixed bounded raw manifests and R54 logs without writes
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\r54-control\r54-evidence-once\entry.mjs"'

      - name: Return issue-bound sanitized TXT and JSON metadata
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\r54-control\r54-evidence-once\entry.mjs" --upload'
