# Generic approved Writer source B installation. This is not an A-grade
# pc-job, Controller maintenance action, recurring schedule, or a release gate.
name: ZGMINI Approved Writer B Source Overlay Once
on:
  issues:
    types: [opened]
permissions:
  contents: write # Create-only sanitized result evidence.
  issues: write # One bounded result comment to originating Issue.
jobs:
  writer-source-approved-b:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      (github.event.issue.title == 'pc-writer-source-install' || github.event.issue.title == 'pc-writer-task-create-once' || github.event.issue.title == 'pc-writer-task-recover-once' || github.event.issue.title == 'r181-protected-route-install' || github.event.issue.title == 'r181-source-shape-readonly' || github.event.issue.title == 'r181-saved-ledger-readonly' || github.event.issue.title == 'w03-r179-stored-handoff-readonly' || github.event.issue.title == 'w03-r179-guard-shape-readonly' || github.event.issue.title == 'w03-r179-readback-guard-install' || github.event.issue.title == 'w03-gmh-seven-history-manual-once' || github.event.issue.title == 'w03-gmh-seven-private-score-once' || github.event.issue.title == 'w03-gmh-seven-public-compat-readonly' || github.event.issue.title == 'w03-gmh-seven-d1-seed-readonly' || github.event.issue.title == 'w03-gmh-seven-collection-time-readonly' || github.event.issue.title == 'r181-primary-route-install' || github.event.issue.title == 'r181-existing-task-run-once' || github.event.issue.title == 'r47-existing-task-run-once' || github.event.issue.title == 'marketparquet-exact-task-retire-once' || github.event.issue.title == 'w03-r47-private-readback-once' || github.event.issue.title == 'w03-r48-private-readback-once' || github.event.issue.title == 'w03-r51-stored-date-readback-once' || github.event.issue.title == 'w01-census-m3-api-once') &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    # Default 12m; separately authorized exact 1200s/2400s modes get
    # bounded 30m/50m jobs. Labels alone never authorize an install.
    timeout-minutes: ${{ contains(github.event.issue.labels.*.name, 'pc-writer-b-extended-drain-2400') && 50 || contains(github.event.issue.labels.*.name, 'pc-writer-b-extended-drain-1200') && 30 || 12 }}
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Pin reviewed control source
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: writer-b-control
          # R181 and W01 Census verify reviewed ancestors; generic Writer B stays shallow.
          fetch-depth: ${{ (github.event.issue.title == 'r181-protected-route-install' || github.event.issue.title == 'r181-primary-route-install' || github.event.issue.title == 'r181-existing-task-run-once' || github.event.issue.title == 'r47-existing-task-run-once' || github.event.issue.title == 'marketparquet-exact-task-retire-once' || github.event.issue.title == 'w03-r179-readback-guard-install' || github.event.issue.title == 'w01-census-m3-api-once') && '0' || ((github.event.issue.title == 'w03-gmh-seven-private-score-once' || github.event.issue.title == 'w03-gmh-seven-collection-time-readonly') && '64' || '1') }}
          persist-credentials: false
      - name: W01 Census #28 API-only approved manual B transaction
        if: github.event.issue.title == 'w01-census-m3-api-once'
        id: w01census
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\inflation-census-api-b\windows-adapter.mjs"'
      - name: W01 create-only redacted Census B JSON TXT and originating Issue readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'w01-census-m3-api-once'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\inflation-census-api-b\report.mjs"'
      - name: Approve exact manifest before candidate checkout
        if: github.event.issue.title == 'pc-writer-source-install'
        id: manifest
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\writer-b\preflight.mjs"'
      - name: Checkout approved public candidate SHA only
        if: github.event.issue.title == 'pc-writer-source-install' && steps.manifest.outcome == 'success'
        id: candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: ${{ steps.manifest.outputs.candidateSourceSha }}
          path: writer-b-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Run approved exact-file Writer B source transaction
        if: github.event.issue.title == 'pc-writer-source-install' && steps.candidate.outcome == 'success'
        id: install
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\writer-b\windows-adapter.mjs" > "%RUNNER_TEMP%\writer-b-install-result.json"'
      - name: W06 exact one-Task B committed manifest preflight
        if: github.event.issue.title == 'pc-writer-task-create-once'
        id: w06taskapprove
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\task-create-b\preflight.mjs"'
      - name: Checkout pinned W06 Task pure candidate only
        if: github.event.issue.title == 'pc-writer-task-create-once' && steps.w06taskapprove.outcome == 'success'
