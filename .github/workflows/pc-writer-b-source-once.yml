# Generic approved Writer source B installation. This is not an A-grade
# pc-job, Controller maintenance action, recurring schedule, or a release gate.
name: ZGMINI Approved Writer B Source Overlay Once
on:
  issues:
    types: [opened]
permissions:
  contents: write # Create-only sanitized result evidence.
  issues: write # One bounded result comment to originating Issue.
jobs:
  writer-source-approved-b:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      (github.event.issue.title == 'pc-writer-source-install' || github.event.issue.title == 'r181-protected-route-install' || github.event.issue.title == 'r181-source-shape-readonly' || github.event.issue.title == 'r181-saved-ledger-readonly' || github.event.issue.title == 'w03-r179-stored-handoff-readonly' || github.event.issue.title == 'w03-r179-guard-shape-readonly' || github.event.issue.title == 'w03-r179-readback-guard-install' || github.event.issue.title == 'w03-gmh-seven-history-manual-once' || github.event.issue.title == 'r181-primary-route-install' || github.event.issue.title == 'r181-existing-task-run-once') &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Pin reviewed control source
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: writer-b-control
          # R181 pins a reviewed code ancestor; generic Writer B stays shallow.
          fetch-depth: ${{ (github.event.issue.title == 'r181-protected-route-install' || github.event.issue.title == 'r181-primary-route-install' || github.event.issue.title == 'r181-existing-task-run-once' || github.event.issue.title == 'w03-r179-readback-guard-install') && '0' || '1' }}
          persist-credentials: false
      - name: Approve exact manifest before candidate checkout
        if: github.event.issue.title == 'pc-writer-source-install'
        id: manifest
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\writer-b\preflight.mjs"'
      - name: Checkout approved public candidate SHA only
        if: github.event.issue.title == 'pc-writer-source-install' && steps.manifest.outcome == 'success'
        id: candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: ${{ steps.manifest.outputs.candidateSourceSha }}
          path: writer-b-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Run approved exact-file Writer B source transaction
        if: github.event.issue.title == 'pc-writer-source-install' && steps.candidate.outcome == 'success'
        id: install
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\writer-b\windows-adapter.mjs" > "%RUNNER_TEMP%\writer-b-install-result.json"'
      - name: R181 exact protected source B (independent immutable manifest)
        if: github.event.issue.title == 'r181-protected-route-install'
        id: r181
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-protected-b-entry.mjs"'
      - name: R181 create-only sanitized result and source Issue readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'r181-protected-route-install'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-protected-b-report.mjs"'
      - name: Apply exact approved R181 primary helper route only
        if: github.event.issue.title == 'r181-primary-route-install'
        id: r181primary
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-primary-b-entry.mjs"'
      - name: R181 primary create-only result and protected hash readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'r181-primary-route-install'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-primary-b-report.mjs"'
      - name: Launch existing registered R181 collector exactly once by approved Windows Task
        if: github.event.issue.title == 'r181-existing-task-run-once'
        id: r181task
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-existing-task-once.mjs"'
      - name: Record one-shot R181 Task run acceptance without asserting data collection
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'r181-existing-task-run-once'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-existing-task-report.mjs"'
      - name: Inspect fixed R181 URL shape without source disclosure or provider calls
        if: github.event.issue.title == 'r181-source-shape-readonly'
        id: r181shape
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-source-shape-run.mjs"'
      - name: R181 readonly shape create-only result and readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'r181-source-shape-readonly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-source-shape-report.mjs"'
      - name: R181 fixed saved ledger 14-symbol metadata read only
        if: github.event.issue.title == 'r181-saved-ledger-readonly'
        id: r181savedledger
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-saved-ledger-readonly.mjs"'
      - name: R181 saved ledger create-only sanitized JSON TXT and readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'r181-saved-ledger-readonly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\r181-saved-ledger-report.mjs"'
      - name: R179 protected stored input source and inventory readonly
        if: github.event.issue.title == 'w03-r179-stored-handoff-readonly'
        id: w03r179
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-r179-stored-handoff-readonly.mjs"'
      - name: Create-only sanitized R179 input handoff JSON TXT and readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'w03-r179-stored-handoff-readonly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-r179-stored-handoff-report.mjs"'
      - name: Inspect pinned R179 actual operator shape without protected source disclosure
        if: github.event.issue.title == 'w03-r179-guard-shape-readonly'
        id: w03r179shape
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-r179-guard-shape-readonly.mjs"'
      - name: Create-only sanitized R179 operator shape JSON TXT readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'w03-r179-guard-shape-readonly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-r179-guard-shape-report.mjs"'
      - name: Apply exact approved R179 seven-theme readback compatibility patch
        if: github.event.issue.title == 'w03-r179-readback-guard-install'
        id: w03r179guard
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-r179-seven-readback-entry.mjs"'
      - name: R179 exact B create-only result pair and source SHA readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'w03-r179-readback-guard-install'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-r179-seven-readback-report.mjs"'
      - name: Authenticate fixed manual seven-theme GMH historical collector source
        if: github.event.issue.title == 'w03-gmh-seven-history-manual-once'
        id: w03gmhmanualpreflight
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-gmh-seven-manual-preflight.mjs"'
      - name: Checkout exact approved GMH-only private collector candidate
        if: github.event.issue.title == 'w03-gmh-seven-history-manual-once' && steps.w03gmhmanualpreflight.outcome == 'success'
        id: w03gmhmanualsource
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: ${{ steps.w03gmhmanualpreflight.outputs.candidateSourceSha }}
          path: w03-gmh-source
          fetch-depth: 1
          persist-credentials: false
      - name: Execute exact approved manual GMH saved historical pages only
        if: github.event.issue.title == 'w03-gmh-seven-history-manual-once' && steps.w03gmhmanualsource.outcome == 'success'
        id: w03gmhmanualrun
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-gmh-seven-manual-once.mjs"'
      - name: Create-only redacted private GMH historical checkpoint pair
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'w03-gmh-seven-history-manual-once'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\tools\w03-gmh-seven-manual-report.mjs"'
      - name: Create-only sanitized result and originating Issue comment
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'pc-writer-source-install'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\writer-b\report.mjs"'
