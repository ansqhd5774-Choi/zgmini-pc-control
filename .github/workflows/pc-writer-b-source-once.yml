        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: ${{ steps.w06taskapprove.outputs.candidateSourceSha }}
          path: task-b-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Create only exact approved W06 CNN minute Task with B CAS
        if: github.event.issue.title == 'pc-writer-task-create-once' && steps.w06taskcandidate.outcome == 'success'
        id: w06taskcreate
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\task-create-b\entry.mjs"'
      - name: Create-only W06 Task B redacted result pair and Issue readback
        if: always() && steps.control.outcome == 'success' && github.event.issue.title == 'pc-writer-task-create-once'
