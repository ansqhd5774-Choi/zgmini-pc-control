# Active, approved one-shot B entrypoint; performs real authorized PC effects.
# Three independently authenticated Issue contracts share this Workflow.
# Keep their cross-job serialization until actual overlapping PC resources,
# leases and Task/DB write effects are proven independent; never assume so
# from differing job names. Historical requests are not replayed.
name: ZGMINI Approved Runtime B Once
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  approved-runtime-b:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-approved-runtime-b' &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Pin reviewed control source
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: generic-b-control
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact configured source from approved Git blob
        id: configured
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\generic-b-control\direct-writer-b\configured-source-pin.mjs"'
      - name: Checkout exact approved configured source
        id: candidate
        if: steps.configured.outputs.candidateCheckoutRequired == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: ${{ steps.configured.outputs.sourceSha }}
          path: configured-feature-source
          fetch-depth: 1
          persist-credentials: false
      - name: Apply exact approved runtime B effect
        id: apply
        if: >-
          success() &&
          (steps.configured.outputs.candidateCheckoutRequired != 'true' ||
          steps.candidate.outcome == 'success')
        run: |
          "E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\generic-b-control\direct-writer-b\run.mjs"
          set "zgmini_apply_exit=%ERRORLEVEL%"
          "E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\generic-b-control\direct-writer-b\capture-apply-exit.mjs" %zgmini_apply_exit%
          exit /b %zgmini_apply_exit%
      - name: Create-only sanitized JSON TXT with readback
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIRECT_B_CONFIGURED_OUTCOME: ${{ steps.configured.outcome }}
          DIRECT_B_CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          DIRECT_B_APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\generic-b-control\direct-writer-b\report.mjs"'
  r47-cmd-onefile-b:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-r47-cmd-onefile-install' &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Checkout exact control event SHA
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: r47-control
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate pinned R47 approval and resolve fixed source
        id: pin
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\r47-control\task-cmd-b\source-pin.mjs"'
      - name: Checkout exact approved R47 CMD source
        id: candidate
        if: success() && steps.pin.outputs.sourceSha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: ${{ steps.pin.outputs.sourceSha }}
          path: r47-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply exact approved R47 one-file Task CMD CAS
        id: apply
        if: success() && steps.candidate.outcome == 'success'
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\r47-control\task-cmd-b\windows-adapter.mjs"'
      - name: Create-only R47 result JSON TXT and verify remote readback
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R47_PIN_OUTCOME: ${{ steps.pin.outcome }}
          R47_CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          R47_APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\r47-control\task-cmd-b\report.mjs"'
  w05-r304-service-bls-once:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-w05-r304-service-once' &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Pin reviewed control SHA without persisting Git credentials
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: w05-r304-control
          fetch-depth: 1
          persist-credentials: false
      - name: Execute exact approved service PPI BLS once into existing SQLite
        id: collect
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\w05-r304-control\w05-r304-service-b\once.mjs"'
      - name: Upload sanitized one-shot JSON TXT and verify readback
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\w05-r304-control\w05-r304-service-b\report.mjs"'
