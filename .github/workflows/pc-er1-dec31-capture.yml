# Single owner-authorized December 2026 PC-private calendar capture.
# Never modifies Core, D1, scheduler, or November data.
name: ZGMINI ER1 December 31 Private Capture
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: zgmini-er1-dec31-one-shot
  cancel-in-progress: false
jobs:
  capture:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-er1-dec31-capture-one-shot' &&
      contains(github.event.issue.labels.*.name, 'pc-er1-approved')
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout event-immutable private approval
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable reviewed December collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: 462941884db7ad2ebb25a7e5872296d074a10c23
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Execute bounded PC-private December collection without GitHub token
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-dec31-entry.mjs"'
      - name: Publish sanitized coverage and day counts only
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-dec31-entry.mjs" --upload'
