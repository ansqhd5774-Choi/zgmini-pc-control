name: ZGMINI CI Controller B Submission
on:
  push:
    branches: [main]
    # A source PR may finish CI before merging; its main push wakes the gated pipeline.
    paths: ['approvals/controller-updates/*.json', 'controller/**', 'ci-approval/**']
  workflow_run:
    workflows: ['ZGMINI Controller Maintenance Source Tests']
    types: [completed]
permissions: {}
jobs:
  submit-controller-b:
    name: submit-controller-b
    # Operational activation remains separate from source review and CI PASS.
    # No pull_request, workflow_dispatch, schedule, or arbitrary target input.
    if: >-
      vars.ZGMINI_CI_CONTROLLER_B_ENABLED == 'true' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.id == 1442936296 &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' &&
        github.event.forced == false &&
        github.event.deleted == false) ||
       (github.event_name == 'workflow_run' &&
        vars.ZGMINI_CI_CONTROLLER_B_POLICY != '' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == 1442936296))
    permissions:
      # Only the fixed publisher can merge an exact two-file approval PR.
      # GitHub's existing merge rules remain in force. No repository-wide
      # settings, administrator privileges or personal token are changed.
      contents: write
      actions: read
      pull-requests: write
      issues: write
    concurrency:
      group: zgmini-ci-controller-b-submission
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      # Pin all transitive publisher source at the reviewed commit, not at the
      # event's main revision, candidate PR or mutable branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d0a62ced5b603351874f0266114d2311dfb88470
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record Controller B request receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZGMINI_CI_CONTROLLER_B_ENABLED: ${{ vars.ZGMINI_CI_CONTROLLER_B_ENABLED }}
          ZGMINI_CI_CONTROLLER_B_RECEIPT_ROOT: ${{ vars.ZGMINI_CI_CONTROLLER_B_RECEIPT_ROOT }}
          ZGMINI_CI_CONTROLLER_B_POLICY: ${{ vars.ZGMINI_CI_CONTROLLER_B_POLICY }}
        run: node ci-approval/completed-run-intake.mjs --publish-existing
