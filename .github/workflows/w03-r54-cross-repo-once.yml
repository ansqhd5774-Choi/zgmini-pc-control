name: W03 R54 Cross-Repository Lease One-Shot
on:
  push:
    branches:
      - codex/w03-r54-crossrepo-contract-20261125
    paths:
      - .github/workflows/w03-r54-cross-repo-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/w03-r54-cross-repo-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-repository-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PC control source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: pc-control
          persist-credentials: false
      - name: Checkout W03 public candidate read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: aa0568707d68b3b2c47312f8252dcfcb9b0843ec
          path: w03
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run both source-lease regression suites
        shell: bash
        run: |
          (cd pc-control && node --test tests/r54-b-source-lease.test.mjs)
          (cd w03 && node --test tests/theme-r54-source-lease.test.mjs)
      - name: Check shared OWNER bytes using both imported locks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {pathToFileURL} from 'node:url';
          const writer=await import(pathToFileURL(path.resolve('w03/scripts/pc-writer/r54-source-lease.mjs')).href);
          const maintainer=await import(pathToFileURL(path.resolve('pc-control/tools/update.mjs')).href);
          const root=fs.mkdtempSync(path.join(os.tmpdir(),'zgmini-w03-cross-lease-'));
          const lockDir=path.join(root,'R54_B_SOURCE_EXCLUSIVE.lock');
          try {
            const w=writer.acquireR54SourceLease({lockDir});
            assert.equal(JSON.parse(fs.readFileSync(w.owner,'utf8')).schema,'ZGMINI_R54_SOURCE_EXCLUSIVE_V1');
            const beforeW=fs.readFileSync(w.owner);
            const blocked=maintainer.acquireR54BSourceLease({leaseDir:lockDir});
            assert.equal(blocked.status,'BUSY');
            assert.deepEqual(fs.readFileSync(w.owner),beforeW);
            w.release();
            const b=maintainer.acquireR54BSourceLease({leaseDir:lockDir});
            assert.equal(b.status,'ACQUIRED');
            const beforeB=fs.readFileSync(b.owner);
            assert.throws(()=>writer.acquireR54SourceLease({lockDir}),/R54_SOURCE_LEASE_HELD/);
            assert.deepEqual(fs.readFileSync(b.owner),beforeB);
            assert.equal(b.release(),true);
            assert.equal(fs.existsSync(lockDir),false);
            console.log('W03_CROSS_REPO_LEASE_WINDOWS_PASS');
          } finally {fs.rmSync(root,{recursive:true,force:true});}
          NODE
