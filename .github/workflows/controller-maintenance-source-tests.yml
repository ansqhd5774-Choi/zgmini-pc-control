permissions:
  contents: read
concurrency:
  group: zgmini-controller-maintenance-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Public repository CI executes ONLY source checks on an ephemeral GitHub-hosted runner.
  # This job never queues the existing operating or isolated self-hosted Windows seats.
  public-source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0 # check immutable historical approvals
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact public source-only event origin
        run: |
          node --check tools/public-source-ci-guard.mjs
          node tools/public-source-ci-guard.mjs
      - name: Verify public source/runner isolation and deferred B approval
        run: |
          node --test --test-concurrency=1 tests/public-source-ci-guard.test.mjs
          node --test --test-concurrency=1 tests/public-pc-job-candidate.test.mjs
          node --test --test-concurrency=1 tests/controller-entry-import-receipt.test.mjs
          node --test --test-concurrency=1 tests/pc-job-late-label-intake.test.mjs
          node --test --test-concurrency=1 tests/public-a-controller-selective-source.test.mjs
          node --test --test-concurrency=1 tests/maintenance-agent.test.mjs
          node --check tools/update.mjs
          node --check tools/controller-public-b-operator-once.mjs
          node --test --test-concurrency=1 tests/controller-public-b-operator-once.test.mjs
          node --test --test-concurrency=1 tests/maintenance-postcheck-link.test.mjs
          node --test --test-concurrency=1 tests/automation-status.test.mjs
          node --test --test-concurrency=1 tests/ci-controller-b-policy-only-proposal.test.mjs
          node --check ci-approval/public-completed-run-observe.mjs
          node --test --test-concurrency=1 tests/ci-approval-public-completed-run-observe.test.mjs
          node --test --test-concurrency=1 tests/supervisor-orphan-six-b-receiver-source.test.mjs
          node --test --test-concurrency=1 tests/supervisor-status-write.test.mjs
  source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - name: Confirm source-only isolated CI host
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo CONTROLLER_MAINTENANCE_SOURCE_ONLY_ISOLATED_HOST=TRUE
          ) else (
            echo CONTROLLER_MAINTENANCE_SOURCE_ONLY_ISOLATED_HOST=FALSE
            exit /b 5
          )
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # PR workflows come from the integration context. Test that same tree:
          # a newer base may add a required test that is absent from an old head.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0 # verify immutable historical V2 B approval bytes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Determine affected source test families
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/controller-ci-scope.mjs
      - name: Check CI scope selection regressions
        run: |
          echo CI_TESTED_INTEGRATION_SHA=%GITHUB_SHA%
          node --test tests/controller-ci-scope.test.mjs
      - name: Verify fixed US R2 receipt inventory and private SHA, without PC or provider IO
        if: hashFiles('tests/us-breadth-r2-private-readonly.test.mjs') != ''
        run: node --test --test-concurrency=1 tests/us-breadth-r2-private-readonly.test.mjs
      - name: Verify CI approval shadow decisions and non-executable candidates
        if: hashFiles('tests/ci-approval-shadow-decision.test.mjs', 'tests/ci-approval-contract-adapter.test.mjs') != ''
        run: node --test --test-concurrency=1 tests/ci-approval-shadow-decision.test.mjs tests/ci-approval-contract-adapter.test.mjs
      - name: Verify isolated C-grade receipt root source without running operator
        if: hashFiles('tests/ci-controller-b-receipt-root-c.test.mjs') != ''
        run: node --test --test-concurrency=1 tests/ci-controller-b-receipt-root-c.test.mjs
      - name: Verify completed CI run intake without issuance
        run: node --test --test-concurrency=1 tests/ci-approval-completed-run-intake.test.mjs tests/ci-approval-execution-identity.test.mjs
      - name: Verify CI approval evidence observations without execution
        if: hashFiles('ci-approval/github-ci-evidence.mjs', 'tests/ci-approval-github-ci-evidence.test.mjs') != ''
        run: node --test --test-concurrency=1 tests/ci-approval-github-ci-evidence.test.mjs
      - name: Verify approval source integrity without authority issuance
        if: hashFiles('ci-approval/approval-source-integrity.mjs', 'tests/ci-approval-approval-source-integrity.test.mjs') != ''
        run: node --test --test-concurrency=1 tests/ci-approval-approval-source-integrity.test.mjs
      - name: Verify exact pinned manifest effect scope without issuance
        if: hashFiles('ci-approval/pinned-manifest-scope.mjs', 'tests/ci-approval-pinned-manifest-scope.test.mjs') != ''
        run: node --test --test-concurrency=1 tests/ci-approval-pinned-manifest-scope.test.mjs
      - name: Verify exact A Writer B workflow dispatch transport without operational calls
        if: hashFiles('ci-approval/native-dispatch.mjs') != '' && hashFiles('tests/ci-native-dispatch.test.mjs') != ''
        run: |
          node --check ci-approval/native-dispatch.mjs
