name: ZGMINI Controller Maintenance Source Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'controller/common.mjs'
      - 'controller/supervisor.mjs'
      - 'controller/core-runtime-source-readonly.mjs'
      - 'controller/core-runtime-source-wmi.mjs'
      - 'tests/core-task-observation.test.mjs'
      - 'tests/supervisor-status-write.test.mjs'
      - 'tools/maintenance-contract.mjs'
      - 'tools/update.mjs'
      - 'tools/runner-watchdog.mjs'
      - 'tests/runner-watchdog.test.mjs'
      - 'watchdog-b/**'
      - 'tests/watchdog-b-upgrade.test.mjs'
      - 'tests/watchdog-b-protection-r2.test.mjs'
      - 'tests/watchdog-guardian-activation.test.mjs'
      - 'tests/watchdog-activation-first-fail.test.mjs'
      - 'tests/watchdog-handoff-firstfail.test.mjs'
      - 'approvals/watchdog-activations/**'
      - '.github/workflows/pc-watchdog-guardian-activate-once.yml'
      - 'tests/watchdog-protected-drift.test.mjs'
      - 'approvals/watchdog-upgrades/**'
      - '.github/workflows/pc-watchdog-b-upgrade-once.yml'
      - 'tests/maintenance-contract.test.mjs'
      - 'tests/controller-heavy-only-install.test.mjs'
      - 'tests/maintenance-apply.test.mjs'
      - '.github/workflows/controller-maintenance-source-tests.yml'
permissions:
  contents: read
concurrency:
  group: zgmini-controller-maintenance-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run scoped maintenance and Controller runtime safety regressions
        run: node --test --test-concurrency=1 tests/maintenance-contract.test.mjs tests/controller-heavy-only-install.test.mjs tests/maintenance-apply.test.mjs tests/core-task-observation.test.mjs tests/supervisor-status-write.test.mjs tests/runner-watchdog.test.mjs tests/watchdog-b-upgrade.test.mjs tests/watchdog-b-protection-r2.test.mjs tests/watchdog-protected-drift.test.mjs tests/watchdog-guardian-activation.test.mjs tests/watchdog-activation-first-fail.test.mjs tests/watchdog-handoff-firstfail.test.mjs
      - name: Validate fixed Watchdog B module syntax without PC writes
        run: |
          node --check watchdog-b/contract.mjs
          node --check watchdog-b/upgrade.mjs
          node --check watchdog-b/report.mjs
          node --check watchdog-b/protected-drift-readonly.mjs
          node --check watchdog-b/guardian-activation.mjs
          node --check watchdog-b/guardian-result.mjs
          node --check watchdog-b/activation-first-fail-readonly.mjs
          node --check watchdog-b/handoff-firstfail-readonly.mjs
      - name: Parse WMI Guardian helper and reject invalid PID without process effects
        run: |
          cscript //NoLogo watchdog-b\guardian-rotate.vbs PROBE NOT_A_PID > "%RUNNER_TEMP%\watchdog-guardian-denied.txt"
          if not "%ERRORLEVEL%"=="5" exit /b 7
          findstr /c:"WATCHDOG_ROTATION_DENIED" "%RUNNER_TEMP%\watchdog-guardian-denied.txt" >nul
          if errorlevel 1 exit /b 8
          cscript //NoLogo watchdog-b\guardian-origin-readonly.vbs NOT_A_PID > "%RUNNER_TEMP%\watchdog-origin-denied.txt"
          if not "%ERRORLEVEL%"=="2" exit /b 9
          findstr /c:"INVALID_PID" "%RUNNER_TEMP%\watchdog-origin-denied.txt" >nul
          if errorlevel 1 exit /b 10
      - name: Confirm source-only isolated CI host
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo CONTROLLER_MAINTENANCE_SOURCE_ONLY_ISOLATED_HOST=TRUE
          ) else (
            echo CONTROLLER_MAINTENANCE_SOURCE_ONLY_ISOLATED_HOST=FALSE
            exit /b 5
          )
