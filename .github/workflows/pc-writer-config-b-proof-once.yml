# One-shot Windows proof of temporary fixtures only: operational config 0 writes.
name: ZGMINI Writer Config B Windows Fixture Proof Once
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  writer-config-b-proof:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-writer-config-b-proof-once' &&
      contains(github.event.issue.labels.*.name, 'pc-maintenance') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-config-b-proof-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Pin reviewed proof source
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: config-b-proof-control
          fetch-depth: 1
          persist-credentials: false
      - name: Test Windows B contract in temporary fixtures only
        id: test
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\config-b-proof-control\writer-config-b\proof-only.mjs" --run'
      - name: Create-only result JSON and TXT with remote readback
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\config-b-proof-control\writer-config-b\proof-only.mjs" --report'
