# Exact CNN Sidecar single-file B transaction. Not a generic pc-job or
# Controller/Writer updater. No scheduled run or arbitrary shell input.
name: ZGMINI CNN Sidecar Approved One-File B Once
on:
  issues:
    types: [opened]
permissions:
  contents: write # Only the bounded reporter step receives GITHUB_TOKEN.
  issues: write # A single originating Issue result comment.
jobs:
  cnn-sidecar-approved-onefile:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.action == 'opened' &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'cnn-sidecar-onefile-b-install' &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Checkout immutable reviewed control main for Issue event
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: cnn-b-control
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify committed approval before any candidate checkout
        id: approval
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\cnn-b-control\sidecar-b\preflight.mjs"'
      - name: Checkout exact approved candidate commit only
        if: steps.approval.outcome == 'success'
        id: candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ steps.approval.outputs.candidateSourceSha }}
          path: cnn-b-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Run fixed one-file transaction with real protected PC probe
        if: steps.candidate.outcome == 'success'
        id: install
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\cnn-b-control\sidecar-b\entry.mjs"'
      - name: Create-only redacted JSON TXT and originating Issue readback
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\cnn-b-control\sidecar-b\report.mjs"'
