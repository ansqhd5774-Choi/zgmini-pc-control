name: SEC Writer B Four-stage Source Simulation
on:
  pull_request:
    paths:
      - 'tests/sec-writer-b-four-stage-risk-simulation.test.mjs'
      - '.github/workflows/sec-writer-b-four-stage-simulation.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run SEC Writer B source-only simulation
        run: node --test tests/sec-writer-b-four-stage-risk-simulation.test.mjs
