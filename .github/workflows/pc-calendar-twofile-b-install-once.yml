# Reviewed calendar B one-shot: exactly two pinned PC source files.
# This is not Controller maintenance, generic pc-job, or a recurrent collector.
name: ZGMINI Release Calendar B Two File Install Once
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: zgmini-release-calendar-twofile-b-install
  cancel-in-progress: false
jobs:
  calendar-approved-b-twofile-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-calendar-twofile-install-once' &&
      contains(github.event.issue.labels.*.name, 'pc-calendar-twofile-b-install') &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Checkout exact event source without persisted credentials
        id: source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install exactly two approved release-calendar files
        id: install
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\calendar-b-twofile\install.mjs"'
      - name: Upload one-shot TXT and JSON, never rerun install
        if: always() && steps.source.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\calendar-b-twofile\upload.mjs"'
