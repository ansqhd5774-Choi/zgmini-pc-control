# W06 B Task source contract only: no Task creation or provider calls.
name: ZGMINI W06 One-Task B Source CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'task-create-b/**'
      - 'approvals/task-create-b/**'
      - 'tests/task-create-b*.test.mjs'
      - '.github/workflows/w06-task-create-b-source-ci.yml'
      - '.github/workflows/pc-writer-b-source-once.yml'
permissions:
  contents: read
concurrency:
  group: zgmini-w06-task-b-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prove dedicated isolated PC
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo W06_TASK_CREATE_B_SOURCE_ONLY_ISOLATED=TRUE
          ) else (
            exit /b 5
          )
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax check all fixed Task B source modules
        run: |
          for %%f in (task-create-b\*.mjs) do node --check "%%f"
      - name: Regress source-only owner manifest and recovery contracts
        run: node --test tests/task-create-b.test.mjs tests/task-create-b-flow.test.mjs
