name: ZGMINI PC ER1 November Saved Forecast Publish B
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: zgmini-er1-nov-forecast-publish-b
  cancel-in-progress: false

jobs:
  saved-forecast-publish:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-er1-nov-forecast-publish' &&
      contains(github.event.issue.labels.*.name, 'pc-er1-approved')
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout fixed control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout fixed forecast source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: 67f769b829195fc33745305234c2bb2de3f1eeb1
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Publish November forecast once from saved data
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-nov-forecast-publish-entry.mjs"'
      - name: Upload status without raw earnings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-nov-forecast-publish-entry.mjs" --upload'
