# B-grade exact-incident recovery. No command from Issue can be executed.
name: ZGMINI Writer B 1063 Exact Reconcile Once
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  writer-b-1063-recover:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-writer-b-1063-reconcile' &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-1063-recovery') &&
      github.run_attempt == 1
    concurrency:
      # Same shared Writer lane as pc-writer-b-source-once.yml.
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Pin reviewed control source
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: writer-b-control
          fetch-depth: 1
          persist-credentials: false
      - name: Recover exact #1063 Core Task only after fail-closed checks
        if: steps.control.outcome == 'success'
        id: reconcile
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\writer-b\recovery-1063-windows.mjs" > "%RUNNER_TEMP%\writer-b-1063-recovery-result.json"'
      - name: Create-only sanitized recovery evidence
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-b-control\writer-b\recovery-1063-report.mjs"'
