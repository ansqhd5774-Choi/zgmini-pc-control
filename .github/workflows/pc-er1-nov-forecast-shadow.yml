name: ZGMINI PC ER1 November Saved Forecast Shadow A
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: zgmini-er1-nov-forecast-shadow
  cancel-in-progress: false

jobs:
  saved-forecast-shadow:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-er1-nov-forecast-shadow' &&
      contains(github.event.issue.labels.*.name, 'pc-er1-approved')
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout fixed control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout fixed ER1 forecast candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: f125feb595e696a73961e450125351530c898743
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Read saved November inputs and calculate aggregate shadow distribution
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-nov30-forecast-shadow.mjs"'
      - name: Report only aggregate read-only result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-nov30-forecast-shadow.mjs" --upload'
