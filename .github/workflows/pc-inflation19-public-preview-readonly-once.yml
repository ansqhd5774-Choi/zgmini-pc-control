# Self-hosted private PC read-only preview of 19 existing inflation series.
name: ZGMINI Inflation 19 Public Summary Readonly Preflight
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: zgmini-inflation19-public-preview-readonly
  cancel-in-progress: false
jobs:
  inflation19_preview:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-inflation19-public-preview-readonly-once'
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 4
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout immutable issue-event private controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout fixed minimal inflation research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: a86229cecd483f39afb501d32ae23e3128134e4e
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Guard source hashes and run read-only 19-series PC summary validation
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\inflation19-public-preview-b-once.mjs"'
      - name: Return fresh issue-bound counts and dates without raw values
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\inflation19-public-preview-b-once.mjs" --upload'
