name: ZGMINI Agent Handoff Intake
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: agent-handoff-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  route-sanitized-incident:
    # Opt-in only. Keep the existing pc-job / Controller path untouched.
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'agent-handoff') &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 3
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Validate queue and record routing only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/issue-broker.mjs
  record-verified-return:
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agent-handoff') &&
      startsWith(github.event.comment.body, '{"schema":"ZGMINI_AGENT_HANDOFF_RESULT_V1"') &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 3
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify PR and CI provenance and record pending runtime return
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/result-broker.mjs
