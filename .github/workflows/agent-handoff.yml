name: ZGMINI Agent Handoff Intake
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  route-sanitized-incident:
    outputs:
      selection_reused: ${{ steps.selection-noop.outcome == 'success' && steps.selection-noop.outputs.reusable == 'true' && 'true' || 'false' }}
    concurrency:
      group: agent-handoff-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    # Opt-in only. Keep the existing pc-job / Controller path untouched.
    if: >-
      github.event_name == 'issues' &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'agent-handoff')) &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'agent-handoff') &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 3
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Validate queue and record routing only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/issue-broker.mjs
      - name: Verify all pending selection receipts without writing
        id: selection-noop
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-dispatcher.mjs --verify-noop
  record-verified-return:
    outputs:
      selection_reused: ${{ steps.selection-noop.outcome == 'success' && steps.selection-noop.outputs.reusable == 'true' && 'true' || 'false' }}
    concurrency:
      group: agent-handoff-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agent-handoff') &&
      (contains(github.event.comment.body, 'ZGMINI_AGENT_HANDOFF_RESULT_V1') ||
       contains(github.event.comment.body, 'ZGMINI_AGENT_HANDOFF_DIAGNOSIS_V1')) &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 3
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify PR and CI provenance and record pending runtime return
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/result-entry.mjs
      - name: Verify all pending selection receipts without writing
        id: selection-noop
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-dispatcher.mjs --verify-noop
  record-work-progress:
    outputs:
      selection_reused: ${{ steps.selection-noop.outcome == 'success' && steps.selection-noop.outputs.reusable == 'true' && 'true' || 'false' }}
    concurrency:
      group: agent-handoff-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agent-handoff') &&
      contains(github.event.issue.labels.*.name, 'handoff-agent-pending') &&
      contains(github.event.comment.body, 'ZGMINI_HANDOFF_WORK_UPDATE_V1') &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 3
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Validate owner work update and return immutable GitHub receipt only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/work-progress-broker.mjs
      - name: Verify all pending selection receipts without writing
        id: selection-noop
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-dispatcher.mjs --verify-noop
  # Continue only after at least one successful intake job and no failed/cancelled intake.
  verify-and-select-after-intake:
    needs: [route-sanitized-incident, record-verified-return, record-work-progress]
    if: >-
      !cancelled() && !failure() &&
      (needs.route-sanitized-incident.result == 'success' ||
       needs.record-verified-return.result == 'success' ||
       needs.record-work-progress.result == 'success') &&
      ((needs.route-sanitized-incident.result == 'success' && needs.route-sanitized-incident.outputs.selection_reused != 'true') ||
       (needs.record-verified-return.result == 'success' && needs.record-verified-return.outputs.selection_reused != 'true') ||
       (needs.record-work-progress.result == 'success' && needs.record-work-progress.outputs.selection_reused != 'true')) &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'ansqhd5774-Choi'
    permissions:
      contents: read
      issues: write
    concurrency:
      group: zgmini-handoff-candidate-selector
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify up to 10 incidents sequentially and record metadata-only candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-dispatcher.mjs
  authenticated-readonly-board-after-selection:
    needs: [route-sanitized-incident, record-verified-return, record-work-progress, verify-and-select-after-intake]
    if: >-
      !cancelled() && !failure() &&
      (needs.route-sanitized-incident.result == 'success' ||
       needs.record-verified-return.result == 'success' ||
       needs.record-work-progress.result == 'success') &&
      (needs.verify-and-select-after-intake.result == 'success' ||
       (needs.verify-and-select-after-intake.result == 'skipped' &&
        (needs.route-sanitized-incident.result != 'success' || needs.route-sanitized-incident.outputs.selection_reused == 'true') &&
         (needs.record-verified-return.result != 'success' || needs.record-verified-return.outputs.selection_reused == 'true') &&
         (needs.record-work-progress.result != 'success' || needs.record-work-progress.outputs.selection_reused == 'true'))) &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.actor == 'ansqhd5774-Choi' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: zgmini-handoff-control-board
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 6
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Classify authenticated backlog, priority, owner receipts and review age
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-board-runner.mjs
