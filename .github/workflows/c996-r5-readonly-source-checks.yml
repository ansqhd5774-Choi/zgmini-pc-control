name: C996 R5 Readonly Source Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: c996-r5-readonly-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  c996-source:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == 'ansqhd5774-Choi/zgmini-pc-control'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node_setup
        with:
          node-version: '22'
      - name: Identify exact permitted queue PC without WIM access
        id: queue_host
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo C996_QUEUE_HOST_MATCH=TRUE
          ) else (
            echo C996_QUEUE_HOST_MATCH=FALSE
            exit /b 5
          )
      - name: Run changed-source regressions only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/c996-source-checks.mjs
      # Reuse the existing isolated source-only Windows job; no new Runner or timer.
      - name: Validate pinned workflow security scanner
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.queue_host.outcome == 'success' }}
        run: node --test tests/ci-zizmor-pr.test.mjs
      - name: Audit changed GitHub Actions workflow security
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.queue_host.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-zizmor-pr.mjs

  # Public source-only workflow audit; Windows-only C996 groups remain isolated.
  public-workflow-audit:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact Public hosted source-only origin
        run: node tools/public-source-ci-guard.mjs
      - name: Verify Public workflow audit scope and pinned release
        run: node --test tests/ci-zizmor-pr.test.mjs
      - name: Audit Public changed workflows offline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-zizmor-pr.mjs
