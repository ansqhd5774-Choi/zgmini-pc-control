name: C996 R5 Readonly Source Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  c996-source:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == 'ansqhd5774-Choi/zgmini-pc-control'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run source-only unit tests
        run: node --test tests/pc-source-origin-readonly.test.mjs tests/c996-r5-readonly-collector.test.mjs tests/c996-r5-readonly-github.test.mjs tests/market-calendar-r44-runtime-readonly.test.mjs tests/market-calendar-r44-production-readonly.test.mjs r54-readiness-once/entry.test.mjs tests/agent-handoff-pc-resource-wait.test.mjs tests/shared-resource-lifecycle.test.mjs
      - name: Run R47 fixed CMD B authorization and CAS tests
        run: node --test tests/r47-cmd-approval-intake.test.mjs tests/r47-cmd-onefile-cas.test.mjs tests/r47-cmd-report.test.mjs tests/r47-cmd-windows-boundary.test.mjs tests/r47-cmd-approval-bytes.test.mjs tests/r47-task-probe-wsh.test.mjs tests/shared-resource-issue-admission.test.mjs controller/theme-r47-task-action-readonly.test.mjs
      - name: Run common recovery and fixed ingress regressions in TEMP
        run: node --test tests/controller-intake-recovery.test.mjs tests/controller-1979-backlog-recovery.test.mjs tests/completed-recovery-claim.test.mjs tests/rollback-stalled-claim.test.mjs tests/interrupted-rollback.test.mjs tests/maintenance-backlog-request.test.mjs tests/r47-task-chain.test.mjs tests/inflation-a401-private23-readonly.test.mjs tests/inflation-a407-integrity-readonly.test.mjs
      - name: Test fixed R47 existing Task once without PC or provider calls
        run: node --test tests/r47-existing-task-once.test.mjs
      - name: Identify exact permitted queue PC without WIM access
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo C996_QUEUE_HOST_MATCH=TRUE
          ) else (
            echo C996_QUEUE_HOST_MATCH=FALSE
            exit /b 5
          )
