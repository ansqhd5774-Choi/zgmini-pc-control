name: ZGMINI PC Publication B - Proposal Disabled
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
concurrency:
  group: zgmini-pc-publication-b-single-lane
  cancel-in-progress: false
jobs:
  publication-b-preflight-only:
    # PROPOSAL ONLY: explicit repo variable alone is NOT B-write approval.
    # This workflow has no apply step and cannot write PC data or D1.
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'pc-publication') &&
      vars.ZGMINI_B_PUBLICATION_PREFLIGHT_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout verified contract only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate signed request and B approval without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\tools\publication-preflight.mjs"'
