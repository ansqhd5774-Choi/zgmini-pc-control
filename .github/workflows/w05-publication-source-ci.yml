name: W05 QFR Publication - Focused Source CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/publication-*.mjs'
      - 'tests/publication-*.test.mjs'
      - 'tests/w05-qfr-publication-draft.test.mjs'
      - 'approvals/publications/**'
      - '.github/workflows/w05-publication-source-ci.yml'
      - 'w05-r304-service-b/**'
      - 'approvals/w05-r304-service-b/**'
      - '.github/workflows/pc-approved-runtime-b-once.yml'
      - '.github/workflows/pc-publication-b.yml'
permissions:
  contents: read
concurrency:
  group: zgmini-w05-publication-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  publication-source:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == 'ansqhd5774-Choi/zgmini-pc-control'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify B publication contract and executor (no operational effects)
        run: node --test tests/publication-contract.test.mjs tests/publication-preflight.test.mjs tests/publication-executor.test.mjs tests/publication-bea-mfg-result.test.mjs tests/w05-qfr-publication-draft.test.mjs
      - name: Verify W05 scoped BLS one-shot approval and metadata (no PC/provider access)
        run: |
          node --check w05-r304-service-b/once.mjs
          node --check w05-r304-service-b/report.mjs
          node --test w05-r304-service-b/contract.test.mjs
