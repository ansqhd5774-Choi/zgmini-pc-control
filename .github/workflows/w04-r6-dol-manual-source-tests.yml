name: ZGMINI W04 DOL Manual Source Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'r6-registered-data-b/**'
      - 'shared-resource/issue-admission.mjs'
      - 'tests/shared-resource-issue-admission.test.mjs'
      - 'controller/employment-r6-collection-evidence-readonly.mjs'
      - 'tests/employment-r6-collection-evidence-readonly.test.mjs'
      - 'controller/employment-r6-raw-run-attestation-readonly.mjs'
      - 'tests/employment-r6-raw-run-light-attestation.test.mjs'
      - 'approvals/controller-updates/d770edbf8dd8193cafcd8e33c9404af48465a07d.json'
      - 'approvals/controller-selective-targets/d770edbf8dd8193cafcd8e33c9404af48465a07d.json'
      - 'tests/w04-raw27-lineage-selective-b.test.mjs'
      - 'controller/employment-r6-candidate-readonly.mjs'
      - 'tests/employment-r6-candidate-readonly.test.mjs'
      - 'tests/w04-pit0605-controller-private-evidence.test.mjs'
      - 'tests/w04-pit0408-private-ledger.test.mjs'
      - 'tests/w04-pit0408-selective-controller-b.test.mjs'
      - 'approvals/controller-updates/f896b2fd05ca6df845e446497ddc71b076fa3ab0.json'
      - 'approvals/controller-selective-targets/f896b2fd05ca6df845e446497ddc71b076fa3ab0.json'
      - 'tests/w04-pit0605-selective-controller-b.test.mjs'
      - 'approvals/source-bundles/manifests/**'
      - 'approvals/employment-r6-registered-data/**'
      - '.github/workflows/w04-r6-dol-manual-source-tests.yml'
permissions:
  contents: read
concurrency:
  group: w04-dol-manual-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify DOL-only authorization and existing registered data regressions
        run: node --test --test-concurrency=1 r6-registered-data-b/dol-manual-v1.test.mjs r6-registered-data-b/operation.test.mjs r6-registered-data-b/operation-injected.test.mjs r6-registered-data-b/report.test.mjs r6-registered-data-b/history-repair.test.mjs
      - name: Verify fixed W04 National error metadata remains bounded and readonly
        run: node --test --test-concurrency=1 tests/employment-r6-collection-evidence-readonly.test.mjs
      - name: Verify bounded raw/run hash attestation without candidate DB
        run: node --test --test-concurrency=1 tests/employment-r6-raw-run-light-attestation.test.mjs tests/w04-raw27-lineage-selective-b.test.mjs
      - name: Verify W04 PIT-04-03 count-only controller projection in isolated CI
        run: node --test --test-concurrency=1 tests/employment-r6-candidate-readonly.test.mjs
      - name: Verify PIT0605 opt-in and persisted private proof without provider/operational I/O
        run: node --test --test-concurrency=1 tests/w04-pit0605-controller-private-evidence.test.mjs
      - name: Verify PIT0408 private key ledger integrity and no-public-data-leak contract
        run: node --test --test-concurrency=1 tests/w04-pit0408-private-ledger.test.mjs
      - name: Verify PIT0408 selective Controller B exact CAS and manifest
        run: node --test --test-concurrency=1 tests/w04-pit0408-selective-controller-b.test.mjs
      - name: Verify PIT0605 two-file Controller B manifest and CAS pin
        run: node --test --test-concurrency=1 tests/w04-pit0605-selective-controller-b.test.mjs
      - name: Check exact dedicated R6 admission without shared false rejection
        run: node --test tests/shared-resource-issue-admission.test.mjs
      - name: Confirm source-only isolated host
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo W04_DOL_MANUAL_TEST_ISOLATED_HOST=TRUE
          ) else (
            exit /b 5
          )
