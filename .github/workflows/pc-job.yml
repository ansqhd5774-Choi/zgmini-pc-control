name: ZGMINI PC Job
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: pc-request-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approved-pc-job:
    if: github.repository == 'ansqhd5774-Choi/zgmini-pc-control' && github.event.repository.private == true && github.actor == 'ansqhd5774-Choi' && contains(github.event.issue.labels.*.name, 'pc-job')
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - name: Stage approved read-only preimage scope
        if: contains(github.event.issue.body, 'preimageManifestPath')
        # The fixed Controller entry must still produce a BLOCKED JSON/TXT
        # when staging itself fails before an attestable scope is available.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\preimage-manifest-stager.mjs"'
      - name: Execute fixed host allowlist entry
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\entry.mjs"'
      - name: Upload sanitized TXT JSON and issue result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\upload.mjs"'
