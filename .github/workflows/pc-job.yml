name: ZGMINI PC Job
# Reconcile GitHub's issues-trigger registration after W04 #3516
# paused/resumed intake on 2026-11-25; prior #3433 ran successfully afterward.
# Comment-only reindex probe. Existing admission and execution stay unchanged.
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: pc-request-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approved-pc-job:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    # Late-label entry is opt-in only after matching fixed Controller and
    # preimage stager hashes have been installed and verified on operating PC.
    # Owner-opened pc-job requests retain the existing admission behavior.
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - name: Stage approved read-only preimage scope
        if: contains(github.event.issue.body, 'preimageManifestPath')
        # The fixed Controller entry must still produce a BLOCKED JSON/TXT
        # when staging itself fails before an attestable scope is available.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\preimage-manifest-stager.mjs"'
      - name: Execute fixed host allowlist entry
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\entry.mjs"'
      - name: Upload sanitized TXT JSON and issue result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\upload.mjs"'


  public-approved-a:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.event.repository.id == 1442936296 &&
      github.event.repository.owner.id == 327938088 &&
      github.event_name == 'issues' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'ansqhd5774-Choi/zgmini-pc-control/.github/workflows/pc-job.yml@refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor == 'ansqhd5774-Choi' &&
      github.actor_id == 327938088 &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.sender.id == 327938088 &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.id == 327938088 &&
      github.event.issue.title == 'pc-job' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    # Public visibility is not authorization: immutable repo/owner identity,
    # authenticated owner-created Issue and fixed main Workflow are required.
    # No PR trigger or checkout. The installed Controller independently checks
    # the identical origin and permits A grade only on Public.
    # Late-label entry remains opt-in; duplicate claims are not replayed.
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      # This read-only guard prevents old Controller modules from ever running
      # on a Public owner Issue before the exact selective B installation.
      # A failed check emits no private result; it cannot authorize B effects.
      - name: Verify pinned installed Public A Controller before all host actions
        id: installed_controller
        run: >-
          "E:\ZGmini\runtime\node.exe" -e "try{const f=require('node:fs'),c=require('node:crypto'),r='E:/ZGmini/automation/pc-control';const ht=f.lstatSync(r+'/host.json');if(!ht.isFile()||ht.isSymbolicLink())process.exit(2);const h=JSON.parse(f.readFileSync(r+'/host.json','utf8'));const p={'controller/common.mjs':'bddd2435644d2619360a63b9b252caea3ce5d99583fe4e543b3225ff11496ee1','controller/entry.mjs':'1874aa1b0b9c6ce109a15737a608a711b81aecb7e3bdcc475032be8b54c1dca7','controller/preimage-manifest-stager.mjs':'806950791803cfc9a1fb387dfdbc4b74757304c48df20e90a2d9b76d52c8cf10','controller/upload.mjs':'a0a6065c7f2fd8f816e6b0a9efd9e7aba14e990bd0336aadc6b0be74baaefe8e'};if(h.controllerSourceSha!=='20d5bbbf305531dca9bf5b74744df83daf37cf17')process.exit(2);if(!h.controllerFiles||typeof h.controllerFiles!=='object'||Array.isArray(h.controllerFiles))process.exit(2);for(const [n,d] of Object.entries(p)){if(h.controllerFiles[n]!==d)process.exit(2);const t=f.lstatSync(r+'/'+n);if(!t.isFile()||t.isSymbolicLink())process.exit(2);if(c.createHash('sha256').update(f.readFileSync(r+'/'+n)).digest('hex')!==d)process.exit(2)}}catch{process.exitCode=2}"
      - name: Stage approved read-only preimage scope
        if: steps.installed_controller.outcome == 'success' && contains(github.event.issue.body, 'preimageManifestPath')
        # The fixed Controller entry must still produce a BLOCKED JSON/TXT
        # when staging itself fails before an attestable scope is available.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\preimage-manifest-stager.mjs"'
      - name: Execute fixed host allowlist entry
        if: steps.installed_controller.outcome == 'success'
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\entry.mjs"'
      - name: Upload sanitized TXT JSON and issue result
        if: always() && steps.installed_controller.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\upload.mjs"'

  # Public issue observation uses ONLY a GitHub-hosted runner and never
  # dispatches any A/B effect or uploads a private PC result.
  public-readonly-intake:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public Issue as read-only candidate, never PC execution
        env:
          ZGMINI_PC_JOB_LATE_LABEL_ENABLED: ${{ vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED }}
        run: |
          node --check tools/public-pc-job-candidate.mjs
          node tools/public-pc-job-candidate.mjs
