name: ZGMINI PC Job
# Reconcile GitHub's issues-trigger registration after W04 #3516
# paused/resumed intake on 2026-11-25; prior #3433 ran successfully afterward.
# Comment-only reindex probe. Existing admission and execution stay unchanged.
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: pc-request-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approved-pc-job:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    # Late-label entry is opt-in only after matching fixed Controller and
    # preimage stager hashes have been installed and verified on operating PC.
    # Owner-opened pc-job requests retain the existing admission behavior.
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - name: Stage approved read-only preimage scope
        if: contains(github.event.issue.body, 'preimageManifestPath')
        # The fixed Controller entry must still produce a BLOCKED JSON/TXT
        # when staging itself fails before an attestable scope is available.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\preimage-manifest-stager.mjs"'
      - name: Execute fixed host allowlist entry
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\entry.mjs"'
      - name: Upload sanitized TXT JSON and issue result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\upload.mjs"'


  public-approved-a:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.event.repository.id == 1442936296 &&
      github.event.repository.owner.id == 327938088 &&
      github.event_name == 'issues' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'ansqhd5774-Choi/zgmini-pc-control/.github/workflows/pc-job.yml@refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor == 'ansqhd5774-Choi' &&
      github.actor_id == 327938088 &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.sender.id == 327938088 &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.id == 327938088 &&
      (github.event.issue.title == 'pc-job' ||
       (startsWith(github.event.issue.title, 'PC Update pc-') &&
        endsWith(github.event.issue.title, ' postcheck'))) &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    # Public visibility is not authorization: immutable repo/owner identity,
    # authenticated owner-created Issue and fixed main Workflow are required.
    # No PR trigger or checkout. The installed Controller independently checks
    # the identical origin and permits A grade only on Public.
    # Late-label entry remains opt-in; duplicate claims are not replayed.
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      # This read-only guard prevents old Controller modules from ever running
      # on a Public owner Issue before the exact selective B installation.
      # A failed check emits no private result; it cannot authorize B effects.
      - name: Verify pinned installed Public A Controller before all host actions
        id: installed_controller
        run: >-
          "E:\ZGmini\runtime\node.exe" -e "try{const f=require('node:fs'),c=require('node:crypto'),r='E:/ZGmini/automation/pc-control';const ht=f.lstatSync(r+'/host.json');if(!ht.isFile()||ht.isSymbolicLink())process.exit(2);const h=JSON.parse(f.readFileSync(r+'/host.json','utf8'));const p={'controller/common.mjs':'9e940a92c0f3ac332ba4d8a5d52b4bac0d647340bdb30863e2628b5b70d27083','controller/entry.mjs':'1874aa1b0b9c6ce109a15737a608a711b81aecb7e3bdcc475032be8b54c1dca7','controller/preimage-manifest-stager.mjs':'806950791803cfc9a1fb387dfdbc4b74757304c48df20e90a2d9b76d52c8cf10','controller/upload.mjs':'a0a6065c7f2fd8f816e6b0a9efd9e7aba14e990bd0336aadc6b0be74baaefe8e'};const next='cde1dd372210e4658ae348cb9e2577967cb11634',lineage='d3764580fdb08ecddd5f9b1064051eec30f90492';const s6='66b8a66c6112441576917e0ac9fbe4d39cbd5eea',s6fix='ee8d8ea8fc7f29a64fb3636f4280e5c6ba51a5c9',s6fix2='15c109dcc2e64a9d2d443f50efc7fe4ce06ff807';if(h.controllerSourceSha!==s6&&h.controllerSourceSha!==s6fix&&h.controllerSourceSha!==s6fix2&&h.controllerSourceSha!==next&&h.controllerSourceSha!==lineage){if(h.controllerSourceSha!=='555f95708984580cd7d5a0fd05a80b718e867710')process.exit(2);}if(h.controllerSourceSha===next||h.controllerSourceSha===lineage){p['controller/operations.mjs']=h.controllerSourceSha===lineage?'6c0441108c244d1d5dd58e7793b785a371169a9d96b69e606200d905e8f59966':'0507663515206b97bb2cad72a2b3fb19032d5ab0f3c2bdd1305eaa6d225d5375';p['config/operations.json']='177cb15b40ca34fc415a091bf93f8f6ac6d607ce4d6f7f429a77d73c8abdcccf';}if(h.controllerSourceSha===s6||h.controllerSourceSha===s6fix||h.controllerSourceSha===s6fix2){p['controller/operations.mjs']='d8d26f2ff7e0740676a2be3d25a35bd3799ab8d08b4f82d4d7426b9a89942631';p['config/operations.json']='95873e17a8e0d44be78b7353f99c99288500a2566cf7b1708ff51c463abaf32c';p['controller/s6-journal-readonly.mjs']=(h.controllerSourceSha===s6fix||h.controllerSourceSha===s6fix2)?'79a0480ac66454829bd7cfe6fb93d2a3fd3c57371c1ea2537f58e92624af4a52':'0801332a91641be02ca62f9237e9b8fc01b052651ac99caa07044b305351b46d';}if(!h.controllerFiles||typeof h.controllerFiles!=='object'||Array.isArray(h.controllerFiles))process.exit(2);for(const [n,d] of Object.entries(p)){if(h.controllerFiles[n]!==d)process.exit(2);const t=f.lstatSync(r+'/'+n);if(!t.isFile()||t.isSymbolicLink())process.exit(2);if(c.createHash('sha256').update(f.readFileSync(r+'/'+n)).digest('hex')!==d)process.exit(2)}}catch{process.exitCode=2}"
      - name: Stage approved read-only preimage scope
        if: steps.installed_controller.outcome == 'success' && contains(github.event.issue.body, 'preimageManifestPath')
        # The fixed Controller entry must still produce a BLOCKED JSON/TXT
        # when staging itself fails before an attestable scope is available.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\preimage-manifest-stager.mjs"'
      - name: Execute fixed host allowlist entry
        if: steps.installed_controller.outcome == 'success'
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\entry.mjs"'
      - name: Upload sanitized TXT JSON and issue result
        if: always() && steps.installed_controller.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\upload.mjs"'

  # Public issue observation uses ONLY a GitHub-hosted runner and never
  # dispatches any A/B effect or uploads a private PC result.
  public-readonly-intake:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public Issue as read-only candidate, never PC execution
        env:
          ZGMINI_PC_JOB_LATE_LABEL_ENABLED: ${{ vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED }}
        run: |
          node --check tools/public-pc-job-candidate.mjs
          node tools/public-pc-job-candidate.mjs
