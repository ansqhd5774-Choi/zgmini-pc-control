name: ZGMINI PC Job
# Reconcile GitHub's issues-trigger registration after W04 #3516
# paused/resumed intake on 2026-11-25; prior #3433 ran successfully afterward.
# Comment-only reindex probe. Existing admission and execution stay unchanged.
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: pc-request-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approved-pc-job:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    # Late-label entry is opt-in only after matching fixed Controller and
    # preimage stager hashes have been installed and verified on operating PC.
    # Owner-opened pc-job requests retain the existing admission behavior.
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - name: Stage approved read-only preimage scope
        if: contains(github.event.issue.body, 'preimageManifestPath')
        # The fixed Controller entry must still produce a BLOCKED JSON/TXT
        # when staging itself fails before an attestable scope is available.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\preimage-manifest-stager.mjs"'
      - name: Execute fixed host allowlist entry
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\entry.mjs"'
      - name: Upload sanitized TXT JSON and issue result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "E:\ZGmini\automation\pc-control\controller\upload.mjs"'

  # Public issue observation uses ONLY a GitHub-hosted runner and never
  # dispatches any A/B effect or uploads a private PC result.
  public-readonly-intake:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      contains(github.event.issue.labels.*.name, 'pc-job') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'pc-job' &&
        vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public Issue as read-only candidate, never PC execution
        env:
          ZGMINI_PC_JOB_LATE_LABEL_ENABLED: ${{ vars.ZGMINI_PC_JOB_LATE_LABEL_ENABLED }}
        run: |
          node --check tools/public-pc-job-candidate.mjs
          node tools/public-pc-job-candidate.mjs
