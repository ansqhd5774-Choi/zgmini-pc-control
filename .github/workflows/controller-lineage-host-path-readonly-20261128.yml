# One-off diagnostic for the exact MODULE_NOT_FOUND observed on the owner PC.
# Read-only on the existing PC Runner; this is NOT the independent B operator.
name: ZGMINI Controller Lineage Host Path Readonly
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/controller-lineage-host-path-readonly-20261128.yml'
permissions:
  contents: read
jobs:
  operator-file-readonly:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.full_name == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == false &&
      github.event.repository.owner.id == 327938088 &&
      github.event.pull_request.user.id == 327938088 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 4
    steps:
      - name: Read-only checkout, runtime and Controller source evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output 'DIAG_SCHEMA=ZGMINI_CONTROLLER_LINEAGE_HOST_PATH_READONLY_V1'
          Write-Output 'EXECUTION_EFFECT=READONLY'
          Write-Output 'B_APPLY_ATTEMPTED=FALSE'
          $isPc = [Environment]::MachineName.ToUpperInvariant() -eq 'PC'
          Write-Output "HOST_IS_PC=$isPc"
          if (-not $isPc) {
            Write-Output 'DIAG_RESULT=WRONG_HOST'
            exit 12
          }
          $checkout = 'E:\ZGmini\projects\zgmini-pc-control'
          $op = Join-Path $checkout 'tools\controller-lineage-public-b-operator-once.mjs'
          $node = 'E:\ZGmini\runtime\node.exe'
          $hostPath = 'E:\ZGmini\automation\pc-control\host.json'
          $checkoutPresent = Test-Path -LiteralPath $checkout -PathType Container
          $operatorPresent = Test-Path -LiteralPath $op -PathType Leaf
          $nodePresent = Test-Path -LiteralPath $node -PathType Leaf
          $hostManifestPresent = Test-Path -LiteralPath $hostPath -PathType Leaf
          Write-Output "CHECKOUT_PRESENT=$checkoutPresent"
          Write-Output "OPERATOR_PRESENT=$operatorPresent"
          Write-Output "NODE_PRESENT=$nodePresent"
          Write-Output "HOST_MANIFEST_PRESENT=$hostManifestPresent"
          if ($operatorPresent) {
            $digest = (Get-FileHash -LiteralPath $op -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "OPERATOR_SHA256=$digest"
          } else {
            Write-Output 'OPERATOR_SHA256=NOT_PRESENT'
          }
          if ($hostManifestPresent) {
            try {
              $record = Get-Content -LiteralPath $hostPath -Raw | ConvertFrom-Json
              if ($record.controllerSourceSha -eq 'cde1dd372210e4658ae348cb9e2577967cb11634') {
                Write-Output 'HOST_SOURCE_STATE=EXISTING_CDE1DD'
              } elseif ($record.controllerSourceSha -eq 'd3764580fdb08ecddd5f9b1064051eec30f90492') {
                Write-Output 'HOST_SOURCE_STATE=NEW_D376'
              } else {
                Write-Output 'HOST_SOURCE_STATE=OTHER_OR_UNVERIFIED'
              }
            } catch {
              Write-Output 'HOST_SOURCE_STATE=UNREADABLE'
            }
          }
          if ($checkoutPresent) {
            $git = Get-Command git.exe -ErrorAction SilentlyContinue
            if ($null -eq $git) {
              Write-Output 'CHECKOUT_HEAD=GIT_UNAVAILABLE'
            } else {
              $head = & $git.Source -C $checkout rev-parse HEAD 2>$null | Select-Object -First 1
              if ($LASTEXITCODE -eq 0 -and $head -match '^[a-f0-9]{40}$') {
                Write-Output "CHECKOUT_HEAD=$head"
                $expected = '0c60109f03b41fae4cd81a26d04733a02e23bb4e'
                $same = $head -eq $expected
                Write-Output "CHECKOUT_MATCHES_REVIEWED_SOURCE_MERGE=$same"
              } else {
                Write-Output 'CHECKOUT_HEAD=NOT_A_GIT_WORKTREE'
              }
            }
          }
          # Read-only protected checkout preflight. Do NOT fetch, reset, merge, or modify the shared checkout.
          Write-Output 'FF_PROTECTION_SCHEMA=ZGMINI_CHECKOUT_PROTECTION_READONLY_V1'
          Write-Output 'CHECKOUT_SYNC_ATTEMPTED=FALSE'
          Write-Output 'SHARED_CHECKOUT_WRITE_COORDINATION=UNVERIFIED'
          $env:GIT_OPTIONAL_LOCKS = '0'
          $env:GIT_TERMINAL_PROMPT = '0'
          if ($checkoutPresent) {
            $git = Get-Command git.exe -ErrorAction SilentlyContinue
            if ($null -eq $git) {
              Write-Output 'FF_STATIC_PREFLIGHT=GIT_UNAVAILABLE'
            } else {
              $root = & $git.Source -C $checkout rev-parse --show-toplevel 2>$null | Select-Object -First 1
              $rootOk = $LASTEXITCODE -eq 0 -and $null -ne $root -and
                ([IO.Path]::GetFullPath([string]$root).TrimEnd('\') -ieq [IO.Path]::GetFullPath($checkout).TrimEnd('\'))
              $branch = & $git.Source -C $checkout symbolic-ref --quiet --short HEAD 2>$null | Select-Object -First 1
              $branchOk = $LASTEXITCODE -eq 0 -and $branch -ceq 'main'
              $origin = & $git.Source -C $checkout remote get-url origin 2>$null | Select-Object -First 1
              $originOk = $LASTEXITCODE -eq 0 -and [string]$origin -cmatch
                '^(?:https://github\.com/|git@github\.com:|ssh://git@github\.com/)ansqhd5774-Choi/zgmini-pc-control(?:\.git)?/?$'
              $dirty = @(& $git.Source -C $checkout -c core.fsmonitor=false -c core.untrackedCache=false status --porcelain=v1 --untracked-files=all 2>$null | Where-Object { $_ -ne '' })
              $statusOk = $LASTEXITCODE -eq 0
              $clean = $statusOk -and $dirty.Count -eq 0
              $remoteSha = $null
              if ($originOk) {
                $remoteLine = & $git.Source -C $checkout ls-remote --heads origin main 2>$null | Select-Object -First 1
                if ($LASTEXITCODE -eq 0 -and $remoteLine -match '^([a-f0-9]{40})\s+refs/heads/main$') {
                  $remoteSha = $Matches[1]
                }
              }
              $remoteReadable = $null -ne $remoteSha
              Write-Output "CHECKOUT_ROOT_EXACT=$rootOk"
              Write-Output "CHECKOUT_BRANCH_MAIN=$branchOk"
              Write-Output "CHECKOUT_STATUS_READABLE=$statusOk"
              Write-Output "CHECKOUT_CLEAN=$clean"
              Write-Output "CHECKOUT_REMOTE_TRUSTED=$originOk"
              Write-Output "REMOTE_MAIN_READABLE=$remoteReadable"
              if ($remoteReadable) { Write-Output "REMOTE_MAIN_SHA=$remoteSha" }
              $staticPass = $rootOk -and $branchOk -and $clean -and $originOk -and $remoteReadable
              Write-Output "FF_STATIC_PREFLIGHT=$staticPass"
            }
          } else {
            Write-Output 'FF_STATIC_PREFLIGHT=CHECKOUT_MISSING'
          }
          if (-not $operatorPresent) {
            Write-Output 'DIAG_RESULT=OPERATOR_FILE_MISSING'
            exit 2
          }
          if (-not $nodePresent) {
            Write-Output 'DIAG_RESULT=NODE_RUNTIME_MISSING'
            exit 3
          }
          Write-Output 'DIAG_RESULT=OPERATOR_FILE_PRESENT_ONLY'
