# Fixed private 2-provider B-grade PC collection, never a generic command runner.
name: ZGMINI Inflation Gas Electricity Private Once
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: zgmini-inflation-gas-electric-private-once
  cancel-in-progress: false
jobs:
  gas_electric:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-inflation-gas-electric-approved-once'
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 5
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout event-immutable private fixed B controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned research-only gas electricity source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: de262f47003e3c32fb685cf2c9b1e3edb1ec1b19
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Execute one guarded provider collection without GitHub token
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\inflation-gas-electric-b-once.mjs"'
      - name: Return sanitized result in private Issue comment
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\inflation-gas-electric-b-once.mjs" --upload'
