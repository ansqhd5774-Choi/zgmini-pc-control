# Exact-two-key provider configuration B. Not an A operation or scheduler.
name: ZGMINI Approved Provider Flags B Once
on:
  issues:
    types: [opened]
permissions:
  contents: write # Create-only sanitized JSON/TXT readback.
  issues: write # One bounded comment on originating request.
concurrency:
  group: zgmini-writer-source-b-one-at-a-time
  cancel-in-progress: false
jobs:
  provider-flags-approved-b:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-writer-provider-flags-once' &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Pin reviewed control source
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: provider-b-control
          fetch-depth: 1
          persist-credentials: false
      - name: Apply exact approved flags, protect and verify original
        id: apply
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\provider-b-control\provider-flags-b\run.mjs"'
      - name: Create-only result JSON and TXT with readback
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\provider-b-control\provider-flags-b\report.mjs"'
