name: ZGMINI Proactive GitHub Diagnostics
on:
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: zgmini-proactive-diagnostics-ledger
  cancel-in-progress: false
jobs:
  newest-first-diagnostic-scanner:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'ansqhd5774-Choi'))
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 6
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect latest 7d GitHub failures and append verified diagnostics only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/proactive-diagnostics-runner.mjs
