name: ZGMINI Handoff Queue Candidate Selector
on:
  workflow_run:
    workflows:
      - ZGMINI Agent Handoff Intake
      - ZGMINI Agent Handoff PC Failure Intake
      - ZGMINI Agent Handoff Writer B Failure Intake
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - agent-handoff/queue-selector.mjs
      - agent-handoff/queue-dispatcher.mjs
      - .github/workflows/agent-handoff-candidate-selector.yml
permissions:
  contents: read
  issues: write
jobs:
  verify-and-select-candidates:
    concurrency:
      group: zgmini-handoff-candidate-selector
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == 'ansqhd5774-Choi') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'ansqhd5774-Choi') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'ansqhd5774-Choi'))
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify up to 10 incidents sequentially and record metadata-only candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-dispatcher.mjs
  # Preserve full board readback without another completed-event Workflow Run.
  authenticated-readonly-board-after-selection:
    needs: verify-and-select-candidates
    if: >-
      needs.verify-and-select-candidates.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: zgmini-handoff-control-board
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 6
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Classify authenticated backlog, priority, owner receipts and review age
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-board-runner.mjs
