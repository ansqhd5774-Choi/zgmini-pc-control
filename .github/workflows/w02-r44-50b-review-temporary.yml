name: W02 R44 50B Fixture Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'controller/market-calendar-r44-input-audit-readonly.mjs'
      - 'tests/market-calendar-r44-input-audit-readonly.test.mjs'
      - '.github/workflows/w02-r44-50b-review-temporary.yml'
permissions:
  contents: read
jobs:
  source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run exact R44 stored-input fixture tests
        run: node --test --test-concurrency=1 tests/market-calendar-r44-input-audit-readonly.test.mjs
      - name: Confirm source-only isolated host
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo W02_R44_50B_SOURCE_ONLY_HOST=TRUE
          ) else (
            exit /b 5
          )
