# Explicit fixed 40-call batch, separate from prior 3-call one-shot.
name: ZGMINI ER1 December Symbol Batch A
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  batch:
    # Keep the existing lane for admitted requests only.
    concurrency:
      group: zgmini-er1-dec31-symbol-batch-a-one-shot
      cancel-in-progress: false
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-er1-dec31-symbol-batch-a-one-shot' &&
      contains(github.event.issue.labels.*.name, 'pc-er1-approved')
    # Restrict issue-upload write access to the two approved operational jobs.
    permissions:
      contents: read
      issues: write
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 12
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout immutable owner approval
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned reviewed 40-symbol collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: 55014d3c76ac1071dbe369c0a7fe72bd94ed0c5a
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Execute PC-private bounded batch without GitHub token
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-dec31-symbol-batch-a-entry.mjs"'
      - name: Upload sanitized per-symbol counts only
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-dec31-symbol-batch-a-entry.mjs" --upload'

  # One separately user-approved TOL/CASY pair-only recovery. The original
  # immutable 40-call job above remains intact and is never re-opened.
  resume-pair:
    # Keep the existing lane for admitted requests only.
    concurrency:
      group: zgmini-er1-dec31-symbol-batch-a-one-shot
      cancel-in-progress: false
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-er1-dec31-symbol-pair-resume-once' &&
      contains(github.event.issue.labels.*.name, 'pc-er1-approved')
    # Restrict issue-upload write access to the two approved operational jobs.
    permissions:
      contents: read
      issues: write
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 12
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout exact approved control revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact approved pair-resume source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: e9895abee60bc74e30380372143daf10cb3333ee
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Execute original-preserving pair-only private action without token
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-dec31-symbol-batch-a-entry.mjs" --pair-resume'
      - name: Upload counts only to new request Issue
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\er1-dec31-symbol-batch-a-entry.mjs" --upload-pair'
