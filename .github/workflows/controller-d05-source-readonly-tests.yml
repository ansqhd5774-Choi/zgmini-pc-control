name: ZGMINI D05 Readonly Source Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'controller/d05-lineage-readonly.mjs'
      - 'controller/sector-r3-dated-ledger-readonly.mjs'
      - 'controller/operations.mjs'
      - 'tests/d05-lineage-readonly.test.mjs'
      - 'tests/sector-r3-dated-ledger-readonly.test.mjs'
      - 'config/operations.json'
      - '.github/workflows/controller-d05-source-readonly-tests.yml'

permissions:
  contents: read

concurrency:
  group: zgmini-d05-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirm isolated CI host
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo D05_SOURCE_ONLY_ISOLATED_HOST=TRUE
          ) else (
            echo D05_SOURCE_ONLY_ISOLATED_HOST=FALSE
            exit /b 5
          )
      - name: Run D05 isolated read-only fixture tests
        run: node --test --test-concurrency=1 tests/d05-lineage-readonly.test.mjs tests/sector-r3-dated-ledger-readonly.test.mjs
