name: ZGMINI Handoff Wide GitHub Scout R3
on:
  schedule:
    - cron: '14,29,44,59 * * * *'
  workflow_run:
    workflows:
      - ZGMINI Handoff Queue Candidate Selector
      - ZGMINI Agent Handoff PR Evidence CI
    types: [completed]
  issues:
    types: [labeled]
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-handoff-wide-scout.yml
      - agent-handoff/wide-scout.mjs
      - agent-handoff/wide-scout-runner.mjs
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: zgmini-proactive-diagnostics-ledger
  cancel-in-progress: false
jobs:
  read-only-extended-monitor:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'ansqhd5774-Choi') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == 'ansqhd5774-Choi' &&
        (github.event.workflow_run.name == 'ZGMINI Handoff Queue Candidate Selector' ||
         github.event.workflow_run.name == 'ZGMINI Agent Handoff PR Evidence CI') &&
        (github.event.workflow_run.name != 'ZGMINI Handoff Queue Candidate Selector' ||
         github.event.workflow_run.head_branch == 'main')) ||
       (github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'handoff-agent-pending' &&
        github.event.issue.state == 'open' &&
        github.event.issue.user.login == 'ansqhd5774-Choi' &&
        github.actor == 'ansqhd5774-Choi') ||
       (github.event_name == 'push' &&
        github.actor == 'ansqhd5774-Choi'))
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect GitHub-only scope and report evidence without PC access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/wide-scout-runner.mjs
