# Only after an owner-verified 19-file Writer B install; not a scheduler.
name: ZGMINI Approved Writer Config B Once
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  writer-config-approved-b:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-writer-config-b-once' &&
      contains(github.event.issue.labels.*.name, 'pc-writer-b-install') &&
      github.run_attempt == 1
    concurrency:
      group: zgmini-writer-source-b-one-at-a-time
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Pin reviewed control source
        id: control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: writer-config-b-control
          fetch-depth: 1
          persist-credentials: false
      - name: Apply exactly approved R6 opt-in after verified 19-file postimage
        id: apply
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-config-b-control\writer-config-b\run.mjs"'
      - name: Create-only sanitized JSON and TXT result with remote readback
        if: always() && steps.control.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\writer-config-b-control\writer-config-b\report.mjs"'
