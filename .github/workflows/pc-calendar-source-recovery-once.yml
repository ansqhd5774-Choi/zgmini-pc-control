name: ZGMINI Calendar Parser Private Source Recovery B Once
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: zgmini-calendar-parser-private-source-recovery-b
  cancel-in-progress: false
jobs:
  parser-private-source-recovery:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.sender.login == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-calendar-parser-source-recovery-once' &&
      contains(github.event.issue.labels.*.name, 'pc-calendar-parser-source-recovery-b') &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    env:
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Checkout exact private control event source
        id: source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Export fixed five historical parser sources to RUNNER_TEMP only
        id: export
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\calendar-source-recovery-b\installer\export.mjs"'
      - name: Upload private staged source and sanitized evidence
        if: success() && steps.export.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\calendar-source-recovery-b\installer\upload.mjs"'
