name: W02 R44 Existing Input Readonly Source Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'controller/market-calendar-r44-input-audit-readonly.mjs'
      - 'controller/operations.mjs'
      - 'config/operations.json'
      - 'tests/market-calendar-r44-input-audit-readonly.test.mjs'
      - '.github/workflows/market-calendar-r44-input-audit-source-tests.yml'

permissions:
  contents: read

concurrency:
  group: zgmini-w02-r44-input-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-only:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 4
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run bounded R44 source-only tests on isolated host
        run: |
          node --check controller/market-calendar-r44-input-audit-readonly.mjs
          node --check controller/operations.mjs
          node --test --test-concurrency=1 tests/market-calendar-r44-input-audit-readonly.test.mjs tests/market-calendar-r44-runtime-readonly.test.mjs
      - name: Confirm isolated CI, never live production PC
        run: |
          if /I "%COMPUTERNAME%"=="DESKTOP-N62L0NG" (
            echo R44_INPUT_AUDIT_SOURCE_ONLY_ISOLATED=TRUE
          ) else (
            exit /b 5
          )
