name: ZGMINI Agent Handoff PC Failure Intake
on:
  workflow_run:
    workflows: [ZGMINI PC Job]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Exact approved historical case token'
        required: true
        type: string
      mode:
        description: 'Preview first; apply only after proof review'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  enqueue-confirmed-failures:
    # Serialize only actual writers. Skipped/untrusted workflow_run events
    # must not hold the shared lane before this job's admission check.
    concurrency:
      group: agent-handoff-pc-failure-intake
      cancel-in-progress: false
      queue: max
    # Activation is controlled by the reviewed repository Actions variable.
    # Keep the workflow disabled until that setting and the operating scope
    # have been confirmed by an authorized maintainer.
    if: >-
      vars.ZGMINI_PC_HANDOFF_INTAKE_ENABLED == 'true' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'issues' &&
        github.event.workflow_run.conclusion != 'skipped' &&
        github.event.workflow_run.actor.login == 'ansqhd5774-Choi') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'ansqhd5774-Choi' &&
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'reconcile-2307-resource-wait' &&
        (inputs.mode == 'preview' || inputs.mode == 'apply')))
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    outputs:
      selection_reused: ${{ steps.selection-noop.outcome == 'success' && steps.selection-noop.outputs.reusable == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # workflow_run replays can otherwise use the old triggering SHA.
          # Execute the reviewed intake source currently on default main.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify published pc-job report and emit one sanitized incident
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: cmd
        run: node agent-handoff/pc-failure-producer.mjs
      - name: Reconcile authenticated historical #2307 wait without PC retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: cmd
        run: node agent-handoff/pc-2307-wait-recovery.mjs
      # Optional read-only proof; failure or uncertainty retains the normal selection Job.
      - name: Verify all pending selection receipts without writing
        id: selection-noop
        if: >-
          github.event_name == 'workflow_run' &&
          vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'ansqhd5774-Choi'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: cmd
        run: node agent-handoff/queue-dispatcher.mjs --verify-noop
  # Keep original intake independent; avoid a second completion-triggered Run.
  verify-and-select-after-failure-intake:
    needs: enqueue-confirmed-failures
    if: >-
      needs.enqueue-confirmed-failures.result == 'success' &&
      needs.enqueue-confirmed-failures.outputs.selection_reused != 'true' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'ansqhd5774-Choi'
    permissions:
      contents: read
      issues: write
    concurrency:
      group: zgmini-handoff-candidate-selector
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify up to 10 incidents sequentially and record metadata-only candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-dispatcher.mjs
  authenticated-readonly-board-after-selection:
    needs: [enqueue-confirmed-failures, verify-and-select-after-failure-intake]
    if: >-
      !cancelled() && !failure() &&
      needs.enqueue-confirmed-failures.result == 'success' &&
      (needs.verify-and-select-after-failure-intake.result == 'success' ||
       (needs.verify-and-select-after-failure-intake.result == 'skipped' &&
        needs.enqueue-confirmed-failures.outputs.selection_reused == 'true')) &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      vars.ZGMINI_AGENT_HANDOFF_ENABLED == 'true' &&
      github.actor == 'ansqhd5774-Choi' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: zgmini-handoff-control-board
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 6
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Classify authenticated backlog, priority, owner receipts and review age
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-handoff/queue-board-runner.mjs
