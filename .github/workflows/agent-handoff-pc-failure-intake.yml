name: ZGMINI Agent Handoff PC Failure Intake
on:
  workflow_run:
    workflows: [ZGMINI PC Job]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  # Single metadata writer lane: two completed PC runs may describe one incident.
  group: agent-handoff-pc-failure-intake
  cancel-in-progress: false
  queue: max
jobs:
  enqueue-confirmed-failures:
    # Activation is controlled by the reviewed repository Actions variable.
    # Keep the workflow disabled until that setting and the operating scope
    # have been confirmed by an authorized maintainer.
    if: >-
      vars.ZGMINI_PC_HANDOFF_INTAKE_ENABLED == 'true' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.event.workflow_run.event == 'issues' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.actor.login == 'ansqhd5774-Choi'
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 pinned
        with:
          node-version: '22'
      - name: Verify published pc-job report and emit one sanitized incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: cmd
        run: node agent-handoff/pc-failure-producer.mjs
