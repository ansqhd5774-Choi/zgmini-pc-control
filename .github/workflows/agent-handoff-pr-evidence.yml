name: ZGMINI Agent Handoff PR Evidence CI
on:
  pull_request:
    types: [labeled, synchronize]

# SOURCE_ONLY proposal. This CI must not read PC data, use the Windows
# self-hosted runtime, or execute before the owner approves its billing scope.
permissions:
  contents: read

concurrency:
  group: zgmini-handoff-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  handoff-source-tests:
    # Only owner-authored, same-repository, main-targeting PRs explicitly
    # labeled for this evidence path may consume runner minutes.
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'ansqhd5774-Choi' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'agent-handoff-ci') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'agent-handoff-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # A normal PR merge-ref is not the same SHA as the proposed fix.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check handoff result and producer contracts
        run: node --test tests/agent-handoff*.test.mjs
