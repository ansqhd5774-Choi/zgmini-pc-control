name: ZGMINI Handoff AI Draft Proposal
on:
  workflow_run:
    workflows: [ZGMINI Handoff Queue Candidate Selector]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing verified handoff Issue number
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: zgmini-ai-proposal-once
  cancel-in-progress: false
  queue: max
jobs:
  propose-one-draft:
    if: >-
      vars.ZGMINI_AI_REPAIR_ENABLED == 'true' &&
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == 'ansqhd5774-Choi') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'ansqhd5774-Choi'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: [self-hosted, Windows, X64, zgmini-handoff-ci-isolated]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Propose at most one bounded review-only GitHub draft PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZGMINI_AI_REPAIR_ENABLED: ${{ vars.ZGMINI_AI_REPAIR_ENABLED }}
          ZGMINI_AI_MODEL: ${{ vars.ZGMINI_AI_MODEL }}
          ZGMINI_AI_API_KEY: ${{ secrets.ZGMINI_AI_API_KEY }}
        run: node agent-handoff/ai-proposal-runner.mjs
