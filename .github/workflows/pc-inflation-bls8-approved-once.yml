# Fixed private B-grade BLS eight-series collector, never a generic command runner.
name: ZGMINI Inflation BLS PPI8 Private Once
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: zgmini-inflation-bls8-private-once
  cancel-in-progress: false
jobs:
  ppi8:
    if: >-
      github.repository == 'ansqhd5774-Choi/zgmini-pc-control' &&
      github.event.repository.private == true &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'pc-inflation-bls8-approved-once'
    runs-on: [self-hosted, Windows, X64, zgmini-pc-control]
    timeout-minutes: 5
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout event-immutable private fixed B controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini-pc-control
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact research-only source pinned by approval manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ansqhd5774-Choi/zgmini
          ref: 17e176454dcf62d5096981b4e2d7f2d112232605
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Execute one guarded registered BLS batch with no GitHub token
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\inflation-bls8-b-once.mjs"'
      - name: Return sanitized result in private issue comment
        if: always()
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"E:\ZGmini\runtime\node.exe" "%GITHUB_WORKSPACE%\control\inflation-bls8-b-once.mjs" --upload'
